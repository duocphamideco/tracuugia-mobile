<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDECO Hub - Kiểm tra PWA</title><style>body{font:15px/1.6 system-ui,Arial;background:#f5f6f8;color:#27282b;margin:0;padding:25px 14px}.wrap{max-width:700px;margin:auto}.box{background:white;border-radius:17px;padding:20px;box-shadow:0 5px 20px #0001;margin:14px 0}h1{font-size:24px;color:#e63728}.good{color:#067545}.bad{color:#c53224}.pending{color:#866100}li{padding:6px}code{word-break:break-all;background:#f7f7f7;padding:1px 4px;border-radius:4px}</style></head><body><div class="wrap"><h1>IDECO Mobile Hub • Kiểm tra PWA</h1><div class="box"><p>Trang này kiểm tra file trên GitHub Pages, không yêu cầu mật khẩu và không đọc dữ liệu ứng dụng.</p><p><strong>Thư mục website:</strong> <code id="scope"></code></p><ol id="results"><li class="pending">Đang kiểm tra...</li></ol></div><p><a href="./">← Mở IDECO Mobile Hub</a></p></div><script>(async()=>{const list=document.getElementById('results');const base=new URL('./',location.href);document.getElementById('scope').textContent=base.href;list.innerHTML='';async function check(label,path,type){const li=document.createElement('li');list.append(li);try{const r=await fetch(new URL(path,base),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);if(type==='json'){const m=await r.json();if(!m.start_url||!m.icons?.length)throw new Error('Thiếu khai báo trong manifest');}if(type==='png'){const blob=await r.blob();const bitmap=await createImageBitmap(blob);if(bitmap.width<120)throw new Error('Biểu tượng quá nhỏ: '+bitmap.width);bitmap.close?.();}li.className='good';li.textContent='✓ '+label+' — OK';}catch(e){li.className='bad';li.textContent='✗ '+label+' — '+e.message;}}await check('Trang chủ','index.html');await check('Manifest','manifest-ideco-webhub-v3.3.webmanifest','json');await check('Logo IDECO WEB HUB Android 192','icons/ideco-webhub-192-v3.3.png','png');await check('Logo IDECO WEB HUB Android 512','icons/ideco-webhub-512-v3.3.png','png');await check('Logo IDECO WEB HUB iOS','apple-touch-ideco-webhub-v3.3.png','png');await check('Service worker','sw.js');let li=document.createElement('li');list.append(li);li.className='pending';if('serviceWorker' in navigator){try{let reg=await navigator.serviceWorker.getRegistration(base.href);li.className=reg?'good':'pending';li.textContent=reg?'✓ Service worker đã đăng ký':'ℹ Service worker sẽ đăng ký sau khi mở trang chủ qua HTTPS';}catch(e){li.className='bad';li.textContent='✗ Service worker: '+e.message;}}else{li.className='bad';li.textContent='✗ Trình duyệt không hỗ trợ service worker';}})();</script></body></html>
