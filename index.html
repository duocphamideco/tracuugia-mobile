/* Doc noi dung PDF/Word de dua vao Kho kien thuc; chi luu TEXT, khong luu file nhi phan */
async function extractKnowledgeFileText(file) {
  if (!file) throw new Error('NO_FILE');
  const name = String(file.name || '').toLowerCase();
  const buf = await file.arrayBuffer();

  if (name.endsWith('.pdf') || file.type === 'application/pdf') {
    if (!window.pdfjsLib) throw new Error('PDF_LIB_MISSING');
    const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const tc = await page.getTextContent();
      pages.push(tc.items.map(it => it.str || '').join(' ').replace(/\s+/g, ' ').trim());
    }
    return pages.filter(Boolean).join('\n\n');
  }

  if (name.endsWith('.docx')) {
    if (!window.mammoth) throw new Error('DOCX_LIB_MISSING');
    const r = await window.mammoth.extractRawText({ arrayBuffer: buf });
    return String(r.value || '').trim();
  }

  if (name.endsWith('.txt') || (file.type || '').startsWith('text/')) {
    return new TextDecoder('utf-8').decode(buf).trim();
  }

  if (name.endsWith('.doc')) throw new Error('OLD_DOC_UNSUPPORTED');
  throw new Error('UNSUPPORTED_FILE');
}

/* ---------------- Helpers ---------------- */
const getLocalDateString = (d) => {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
};
const viDate = (s) => (s ? s.split('-').reverse().join('/') : '');

const isCustomerOverdue = (c) => {
  if (c.status !== TransactionStatus.DANG_THEO_DOI) return false;
  const today = getLocalDateString(new Date());
  const un = (c.appointments || []).filter(a => !a.isCompleted);
  const overdue = un.filter(a => a.date < today);
  const future = un.some(a => a.date >= today);
  return overdue.length > 0 && !future;
};

/* ---------------- Phone / contact helpers ---------------- */
// Chuan hoa SDT VN: bo khoang trang, dau cham, gach; +84 -> 0
function normPhone(p) {
  let s = String(p || '').replace(/[^\d+]/g, '');
  if (s.startsWith('+84')) s = '0' + s.slice(3);
  else if (s.startsWith('84') && s.length >= 10) s = '0' + s.slice(2);
  return s;
}
// Zalo dung so quoc te khong dau +
function zaloPhone(p) {
  const s = normPhone(p);
  return s.startsWith('0') ? '84' + s.slice(1) : s.replace(/^\+/, '');
}
const telHref  = (p) => 'tel:' + normPhone(p);
const smsHref  = (p) => 'sms:' + normPhone(p);
const zaloHref = (p) => 'https://zalo.me/' + zaloPhone(p);

/* ============================== UI PRIMITIVES ============================== */

function Toast({ n }) {
  if (!n) return null;
  const map = {
    success: 'bg-jade', error: 'bg-crimson', warning: 'bg-amber2', info: 'bg-brand'
  };
  return (
    <div className="fixed left-1/2 -translate-x-1/2 bottom-6 z-[1500] px-5 py-3 rounded-2xl shadow-pop text-white text-[13px] font-bold max-w-[92vw] text-center fade-in"
         style={{ paddingBottom: 'max(12px, env(safe-area-inset-bottom))' }}>
      <span className={`absolute inset-0 rounded-2xl ${map[n.type] || 'bg-ink'}`}></span>
      <span className="relative">{n.msg}</span>
    </div>
  );
}

function Modal({ open, onClose, children, max = 'max-w-md', z = 900, shake }) {
  if (!open) return null;
  return (
    <div className="modal-wrap fade-in" style={{ zIndex: z }} onClick={onClose ? (e) => { if (e.target === e.currentTarget) onClose(); } : undefined}>
      <div className={`sheet pop-in ${max} ${shake ? 'shake' : ''} max-h-[92vh] overflow-y-auto`}>{children}</div>
    </div>
  );
}

/** Nut so dien thoai: bam ra menu Goi / SMS / Zalo */
function PhoneAction({ phone, compact }) {
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);
  useEffect(() => {
    if (!open) return;
    const away = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', away);
    document.addEventListener('touchstart', away);
    return () => { document.removeEventListener('mousedown', away); document.removeEventListener('touchstart', away); };
  }, [open]);
  if (!phone) return null;
  const stop = (e) => { e.stopPropagation(); };
  const items = [
    { k: 'call', label: 'Gọi điện',   href: telHref(phone),  icon: <I.Phone width="15" height="15" />,   cls: 'text-jade' },
    { k: 'sms',  label: 'Nhắn SMS',   href: smsHref(phone),  icon: <I.Message width="15" height="15" />, cls: 'text-brand' },
    { k: 'zalo', label: 'Nhắn Zalo',  href: zaloHref(phone), icon: <I.Zalo width="15" height="15" />,    cls: 'text-[#0068ff]', ext: true }
  ];
  return (
    <span className="relative inline-block" ref={wrapRef} onClick={stop}>
      <button onClick={(e) => { stop(e); setOpen(o => !o); }}
        className={`btn font-mono font-bold text-brand hover:bg-blue-50 ${compact ? 'text-[13px] px-2 py-1' : 'text-[15px] px-2.5 py-1.5'} -ml-2`}
        title="Bấm để gọi, nhắn SMS hoặc Zalo">
        <I.Phone width={compact ? 13 : 14} height={compact ? 13 : 14} /> {phone}
      </button>
      {open && (
        <span className="absolute left-0 top-full mt-1 z-50 bg-white rounded-2xl shadow-pop border border-line p-1.5 min-w-[168px] flex flex-col pop-in">
          {items.map(it => (
            <a key={it.k} href={it.href}
               {...(it.ext ? { target: '_blank', rel: 'noopener' } : {})}
               onClick={(e) => { stop(e); setOpen(false); }}
               className={`btn justify-start px-3 py-2.5 text-[13px] hover:bg-paper ${it.cls}`}>
              {it.icon} <span className="text-ink font-semibold">{it.label}</span>
            </a>
          ))}
        </span>
      )}
    </span>
  );
}

function burstConfetti() {
  const colors = ['#e08a1e', '#0f9d76', '#1d6fd0', '#d8324b', '#6d4de0', '#f5c451'];
  for (let i = 0; i < 44; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[i % colors.length];
    el.style.animationDuration = (2.4 + Math.random() * 1.8) + 's';
    el.style.animationDelay = (Math.random() * .5) + 's';
    el.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4600);
  }
}


/* ========================= KHO KIEN THUC XU LY TINH HUONG ========================= */
function KnowledgeBaseSettings({ notify }) {
  const [items, setItems] = useState([]);
  const [editingId, setEditingId] = useState('');
  const [title, setTitle] = useState('');
  const [content, setContent] = useState('');
  const [saving, setSaving] = useState(false);
  const [fileBusy, setFileBusy] = useState(false);
  const [listening, setListening] = useState(false);
  const recRef = useRef(null);
  const speechBaseRef = useRef('');
  const fileRef = useRef(null);

  useEffect(() => {
    const off = dbOnValue('settings/aiHandlingKnowledge', d => setItems(normalizeKnowledgeEntries(d)));
    return () => { off && off(); stopSpeech(); };
  }, []);

  const newItem = () => {
    stopSpeech();
    setEditingId(''); setTitle(''); setContent('');
  };

  const editItem = (it) => {
    stopSpeech();
    setEditingId(it.id || ''); setTitle(it.title || ''); setContent(it.content || '');
  };

  const saveItem = async () => {
    stopSpeech();
    const t = title.trim(), c = content.trim();
    if (!t) { notify('Vui lòng nhập tiêu đề tình huống', 'warning'); return; }
    if (!c) { notify('Vui lòng nhập nội dung cách xử lý', 'warning'); return; }
    const id = editingId || uuid();
    const old = items.find(x => x.id === id);
    const payload = {
      id, title: t, content: c,
      createdAt: old?.createdAt || Date.now(),
      updatedAt: Date.now()
    };
    setSaving(true);
    const ok = await dbSet(`settings/aiHandlingKnowledge/${id}`, payload);
    setSaving(false);
    if (!ok) { notify('Không lưu được kho kiến thức lên Firebase', 'error'); return; }
    setEditingId(id);
    notify('Đã lưu tình huống vào Kho kiến thức AI', 'success');
  };

  const removeItem = async (it) => {
    if (!window.confirm(`Xóa tình huống “${it.title}”?`)) return;
    const ok = await dbRemove(`settings/aiHandlingKnowledge/${it.id}`);
    if (!ok) { notify('Không xóa được nội dung', 'error'); return; }
    if (editingId === it.id) newItem();
    notify('Đã xóa tình huống', 'success');
  };

  function stopSpeech() {
    const r = recRef.current; recRef.current = null;
    if (r) { r.onend = null; r.onresult = null; try { r.stop(); } catch (e) {} }
    setListening(false);
  }

  const toggleSpeech = () => {
    if (recRef.current) { stopSpeech(); return; }
    setListening(true);
    recRef.current = window.idecoSpeech.start({
      base: content || '', onText: setContent,
      onStop: () => { recRef.current = null; setListening(false); },
      onError: message => notify(message, 'warning', 6000)
    });
  };

  const uploadFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setFileBusy(true);
    try {
      let txt = await extractKnowledgeFileText(file);
      if (!txt) throw new Error('EMPTY_FILE_TEXT');
      const max = 150000;
      if (txt.length > max) {
        txt = txt.slice(0, max) + '\n\n[Phần còn lại của tài liệu đã được lược bớt do dung lượng quá lớn.]';
        notify('Tài liệu rất dài — đã lấy 150.000 ký tự đầu để tránh kho dữ liệu quá nặng', 'warning', 5000);
      } else notify(`Đã đọc nội dung từ ${file.name}`, 'success');
      if (!title.trim()) setTitle(file.name.replace(/\.(pdf|docx|txt)$/i, ''));
      setContent(prev => (prev.trim() ? prev.trim() + '\n\n' : '') + txt);
    } catch (err) {
      const code = String(err && err.message || err);
      const msg = code.includes('OLD_DOC') ? 'File .doc đời cũ chưa đọc trực tiếp được. Hãy lưu lại thành .docx rồi tải lên.'
        : code.includes('PDF_LIB') ? 'Không tải được bộ đọc PDF. Kiểm tra kết nối Internet rồi thử lại.'
        : code.includes('DOCX_LIB') ? 'Không tải được bộ đọc Word. Kiểm tra kết nối Internet rồi thử lại.'
        : code.includes('EMPTY_FILE_TEXT') ? 'Không trích xuất được chữ từ tài liệu này. PDF có thể là bản scan hình ảnh.'
        : 'Chỉ hỗ trợ Word .docx, PDF hoặc TXT.';
      notify(msg, 'error', 5500);
    } finally { setFileBusy(false); }
  };

  return (
    <section className="bg-white border border-line rounded-2xl p-5 sm:p-7">
      <div className="flex flex-wrap items-start justify-between gap-3 mb-2">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl bg-amber-50 text-amber2 flex items-center justify-center"><I.Sparkles width="18" height="18" /></div>
          <div>
            <h3 className="font-display text-[17px] font-extrabold text-ink">Kho kiến thức xử lý tình huống AI</h3>
            <p className="text-[11px] text-slate-400 font-semibold">Kinh nghiệm nội bộ để AI tư vấn sát cách IDECO xử lý khách hàng</p>
          </div>
        </div>
        <button onClick={newItem} className="btn px-3.5 py-2.5 bg-ink text-white text-[11.5px]">
          <I.Plus width="14" height="14" /> Thêm mới
        </button>
      </div>

      <p className="text-[12.5px] text-slate-500 leading-relaxed mb-5">
        Mỗi mục gồm một tình huống và cách xử lý chuẩn. AI sẽ tham chiếu kho này khi phân tích hồ sơ khách hàng mới nhất. Có thể nhập bằng bàn phím, giọng nói hoặc lấy chữ từ Word/PDF.
      </p>

      <div className="space-y-4">
        <Field label="Tiêu đề tình huống">
          <input value={title} onChange={e => setTitle(e.target.value)} className="fld font-bold" placeholder="Ví dụ: Khách chê giá cao và yêu cầu tăng chiết khấu" />
        </Field>
        <Field label="Nội dung / cách xử lý">
          <textarea value={content} onChange={e => setContent(e.target.value)} className="fld leading-relaxed text-[13px]"
            placeholder="Mô tả tình huống, nguyên tắc xử lý, câu hỏi cần khai thác, chính sách được phép đề xuất, bước tiếp theo..."
            style={{ resize:'vertical', minHeight:'170px', maxHeight:'520px' }} />
        </Field>

        <div className="grid sm:grid-cols-2 gap-2">
          <button onClick={toggleSpeech}
            className={`btn py-3 text-[12px] border ${listening ? 'bg-crimson text-white border-crimson' : 'bg-blue-50 text-brand border-blue-100'}`}>
            {listening ? <><span className="w-2.5 h-2.5 bg-white rounded-sm pulse-ring" /> Đang nghe — bấm để dừng</>
              : <><I.Mic width="15" height="15" /> Nói thành văn bản</>}
          </button>
          <button onClick={() => fileRef.current && fileRef.current.click()} disabled={fileBusy}
            className="btn py-3 bg-paper text-slate-600 border border-line text-[12px] disabled:opacity-60">
            {fileBusy ? <I.Loader width="15" height="15" className="animate-spin" /> : <I.Upload width="15" height="15" />}
            {fileBusy ? 'Đang đọc tài liệu…' : 'Tải Word / PDF'}
          </button>
          <input ref={fileRef} type="file" accept=".docx,.pdf,.txt,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain"
            onChange={uploadFile} className="hidden" />
        </div>

        <button onClick={saveItem} disabled={saving}
          className="btn w-full py-3.5 bg-amber2 text-white text-[13px] uppercase tracking-wider shadow-lift disabled:opacity-60">
          {saving ? <I.Loader width="16" height="16" className="animate-spin" /> : <I.Save width="16" height="16" />}
          {saving ? 'Đang lưu…' : (editingId ? 'Lưu cập nhật' : 'Lưu vào kho kiến thức')}
        </button>
      </div>

      <div className="mt-6 pt-5 border-t border-line">
        <div className="flex items-center justify-between gap-2 mb-3">
          <p className="lbl mb-0">Nội dung đã lưu ({items.length})</p>
          {editingId && <span className="text-[10.5px] font-bold text-amber2">Đang sửa 1 mục</span>}
        </div>
        {items.length === 0 ? (
          <div className="rounded-2xl bg-paper p-4 text-[12.5px] text-slate-400 text-center">Chưa có tình huống nào trong kho.</div>
        ) : (
          <div className="space-y-2 max-h-[360px] overflow-y-auto pr-1">
            {items.map(it => (
              <div key={it.id} className={`spine rounded-2xl border p-4 pl-5 ${editingId === it.id ? 'bg-amber-50/60 border-amber-200' : 'bg-paper border-transparent'}`}
                   style={{ '--spine': editingId === it.id ? '#e08a1e' : '#cbd5e1' }}>
                <p className="font-bold text-ink text-[13.5px]">{it.title}</p>
                <p className="text-[11.5px] text-slate-500 mt-1.5 line-clamp-2 leading-relaxed">{it.content}</p>
                <div className="flex gap-2 mt-3">
                  <button onClick={() => editItem(it)} className="btn px-3 py-2 bg-white border border-line text-brand text-[11px]"><I.Edit width="13" height="13" /> Sửa</button>
                  <button onClick={() => removeItem(it)} className="btn px-3 py-2 bg-white border border-rose-100 text-crimson text-[11px]"><I.Trash width="13" height="13" /> Xóa</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </section>
  );
}


/* ================= SMART REPORT QUALITY GATE — kiểm tra trước khi lưu ================= */
const DEFAULT_REPORT_QUALITY_CONFIG = Object.freeze({
  enabled: true,
  aiBeforeSave: true,
  blockOnIncomplete: false,
  minReportWords: 25,
  minFeedbackWords: 6,
  requireProduct: true,
  requirePolicy: true,
  requireFeedback: true,
  requireNextStep: true,
  customInstruction: 'Mỗi báo cáo cần trả lời rõ: (1) đã chào sản phẩm hoặc danh mục nào cụ thể; (2) đã trao đổi chính sách gì cụ thể như giá, chiết khấu, chương trình, công nợ, đổi trả hoặc điều kiện đơn hàng; (3) khách hàng phản hồi thực tế ra sao và phản hồi đó liên quan sản phẩm/chính sách nào; (4) bước xử lý tiếp theo và thời điểm theo dõi. Không chấp nhận các câu chung chung như “đã chào sản phẩm”, “đã gửi danh mục”, “đã trao đổi chính sách”, “khách quan tâm”, “khách xem xét” nếu không có chi tiết.'
});

function normalizeReportQualityConfig(v) {
  const src = (v && typeof v === 'object') ? v : {};
  const num = (x, d, min, max) => {
    const n = Number(x);
    return Number.isFinite(n) ? Math.max(min, Math.min(max, Math.round(n))) : d;
  };
  return {
    enabled: typeof src.enabled === 'boolean' ? src.enabled : DEFAULT_REPORT_QUALITY_CONFIG.enabled,
    aiBeforeSave: typeof src.aiBeforeSave === 'boolean' ? src.aiBeforeSave : DEFAULT_REPORT_QUALITY_CONFIG.aiBeforeSave,
    blockOnIncomplete: false,
    minReportWords: num(src.minReportWords, DEFAULT_REPORT_QUALITY_CONFIG.minReportWords, 5, 200),
    minFeedbackWords: num(src.minFeedbackWords, DEFAULT_REPORT_QUALITY_CONFIG.minFeedbackWords, 2, 80),
    requireProduct: typeof src.requireProduct === 'boolean' ? src.requireProduct : DEFAULT_REPORT_QUALITY_CONFIG.requireProduct,
    requirePolicy: typeof src.requirePolicy === 'boolean' ? src.requirePolicy : DEFAULT_REPORT_QUALITY_CONFIG.requirePolicy,
    requireFeedback: typeof src.requireFeedback === 'boolean' ? src.requireFeedback : DEFAULT_REPORT_QUALITY_CONFIG.requireFeedback,
    requireNextStep: typeof src.requireNextStep === 'boolean' ? src.requireNextStep : DEFAULT_REPORT_QUALITY_CONFIG.requireNextStep,
    customInstruction: String(src.customInstruction || DEFAULT_REPORT_QUALITY_CONFIG.customInstruction).trim().slice(0, 4000)
  };
}

function reportWordCount(v) {
  const s = String(v || '').trim();
  return s ? s.split(/\s+/).filter(Boolean).length : 0;
}

function reportQualityIssue(code, message, question, severity = 'required') {
  return { code, message, question, severity };
}

function reportHasSpecificProduct(report) {
  const s = String(report || '').trim();
  if (!s) return false;
  /* Dấu hiệu mạnh: mã/nhãn có chữ + số, tên UVS..., hoặc cụm sau nhãn "sản phẩm/thuốc/danh mục". */
  if (/\bUVS\s+[A-Za-zÀ-ỹ0-9][A-Za-zÀ-ỹ0-9._-]{2,}(?:\s+[A-Za-zÀ-ỹ0-9._-]{2,})?/iu.test(s)) return true;
  if (/\b[A-Za-zÀ-ỹ]{2,}[A-Z0-9][A-Za-zÀ-ỹ0-9._-]{2,}\b/u.test(s)) return true;
  const m = s.match(/(?:sản phẩm|sp|thuốc|danh mục|nhóm sản phẩm|nhóm thuốc)\s*(?:là|gồm|:|-)?\s*([^,.;\n]{3,80})/iu);
  if (m && m[1]) {
    const x = m[1].trim().toLowerCase();
    const genericOnly = /^(và|để|cho|với|đã|có|mới|cũ|của công ty|ideco|đang bán|cần bán|phù hợp|khác|này|đó|trên|dưới|cho khách|với khách)(\s|$)/iu.test(x);
    if (!genericOnly && x.split(/\s+/).length >= 1) return true;
  }
  /* Tên riêng viết hoa / mã hàng trong câu chào, giới thiệu, báo giá. */
  if (/(?:chào|giới thiệu|tư vấn|báo giá|gửi giá|gởi giá)[^.\n]{0,80}\b[A-ZĐ][A-Z0-9Đ._-]{2,}\b/u.test(s)) return true;
  return false;
}

function reportHasSpecificPolicy(report) {
  const s = String(report || '').toLowerCase();
  if (!s) return false;
  if (/(chưa|không)\s+(?:trao đổi|báo|áp dụng|gửi|gởi)\s+(?:được\s+)?(?:giá|chính sách|chiết khấu|ctkm|chương trình)[^.\n]{0,120}\b(vì|do|chờ|cần|đợi)\b/i.test(s)) return true;
  if (/\d+(?:[.,]\d+)?\s*%/i.test(s)) return true;
  if (/\b\d{1,3}(?:[.,]\d{3})+\s*(?:đ|đồng|vnd)\b/i.test(s)) return true;
  if (/\b(?:công nợ|đổi trả|thanh toán|trả chậm|hỗ trợ trưng bày|thưởng doanh số|foc|ctkm|chương trình)\b[^.\n]{0,90}\b(?:\d+|ngày|tháng|hộp|chai|gói|đơn|%|đồng|vnd|tặng|mua|đổi|trả)\b/i.test(s)) return true;
  if (/\b(?:mua|lấy)\s+\d+[^.\n]{0,60}\b(?:tặng|chiết khấu|ck|giảm|hỗ trợ)\b/i.test(s)) return true;
  return false;
}

function reportHasUsefulFeedback(feedback, minWords = 6) {
  const s = String(feedback || '').trim();
  if (reportWordCount(s) < Math.max(2, Number(minWords) || 6)) return false;
  const vague = /^(khách\s*)?(có\s*)?(phản hồi|quan tâm|xem xét|tham khảo|để xem|sẽ xem|đang xem|chưa biết|ok|đồng ý|từ chối)\s*[.!]*$/iu;
  if (vague.test(s)) return false;
  return /(khách|anh|chị|cô|chú|nhà thuốc|công ty|đồng ý|từ chối|quan tâm|chê|khen|giá|chiết khấu|công nợ|đổi trả|muốn|cần|yêu cầu|hỏi|đặt|mua|lấy|xem xét|chưa có nhu cầu|không nhu cầu|hẹn|phản hồi)/iu.test(s);
}

function reportHasNextStep(report, feedback) {
  const s = `${report || ''} ${feedback || ''}`.toLowerCase();
  return /\b(gửi|gởi|gọi|liên hệ|hẹn|theo dõi|follow|chốt|phản hồi lại|trao đổi lại|ghé lại|tư vấn lại|báo giá|gửi danh mục|gởi danh mục|xin ý kiến|trình bgđ|nhắc lại|kiểm tra lại)\b/i.test(s) ||
         /\b(ngày|thứ|tuần|mai|mốt|chiều|sáng|tháng)\s*(?:\d{1,2})?/i.test(s);
}

function buildLocalReportAudit(report, customerFeedback, cfgInput) {
  const cfg = normalizeReportQualityConfig(cfgInput);
  const reportText = String(report || '').trim();
  const feedbackText = String(customerFeedback || '').trim();
  const issues = [];
  const checklist = [];
  const wc = reportWordCount(reportText);

  const pushCheck = (code, label, ok, detail, issue) => {
    checklist.push({ code, label, ok: !!ok, detail: detail || '' });
    if (!ok && issue) issues.push(issue);
  };

  pushCheck(
    'report_length',
    `Nội dung báo cáo ≥ ${cfg.minReportWords} từ`,
    wc >= cfg.minReportWords,
    `${wc}/${cfg.minReportWords} từ`,
    reportQualityIssue('report_length', `Nội dung báo cáo mới có ${wc} từ, chưa đủ mức tối thiểu ${cfg.minReportWords} từ.`, 'Bạn hãy mô tả rõ đã trao đổi gì, phản hồi khách hàng và bước tiếp theo.')
  );

  if (cfg.requireProduct) {
    const ok = reportHasSpecificProduct(reportText);
    pushCheck('product', 'Sản phẩm / danh mục cụ thể', ok, ok ? 'Đã nhận diện dấu hiệu cụ thể' : 'Đang còn chung chung',
      reportQualityIssue('product', 'Chưa nêu rõ tên sản phẩm hoặc danh mục cụ thể đã chào/trao đổi.', 'Bạn đã chào sản phẩm nào? Tên thuốc/nhãn hàng/danh mục nào cụ thể?'));
  }

  if (cfg.requirePolicy) {
    const ok = reportHasSpecificPolicy(reportText);
    pushCheck('policy', 'Chính sách bán hàng cụ thể', ok, ok ? 'Có chi tiết chính sách' : 'Chưa thấy điều kiện/giá/CK/công nợ...',
      reportQualityIssue('policy', 'Chưa nêu chính sách bán hàng cụ thể đã trao đổi hoặc lý do chưa thể trao đổi.', 'Bạn đã trao đổi chính sách gì: giá, chiết khấu %, chương trình, công nợ, đổi trả hay điều kiện đặt hàng?'));
  }

  if (cfg.requireFeedback) {
    const ok = reportHasUsefulFeedback(feedbackText, cfg.minFeedbackWords);
    pushCheck('feedback', 'Phản hồi thực tế của khách', ok, ok ? `${reportWordCount(feedbackText)} từ phản hồi` : 'Phản hồi còn thiếu hoặc quá chung',
      reportQualityIssue('feedback', 'Phản hồi khách hàng chưa đủ cụ thể để hiểu khách đang đồng ý/từ chối/vướng ở đâu.', 'Khách hàng phản hồi cụ thể ra sao? Với sản phẩm/chính sách nào? Lý do hoặc điều kiện của khách là gì?'));
  }

  if (cfg.requireNextStep) {
    const ok = reportHasNextStep(reportText, feedbackText);
    pushCheck('next_step', 'Bước xử lý tiếp theo', ok, ok ? 'Đã thấy hành động theo dõi' : 'Chưa thấy bước tiếp theo',
      reportQualityIssue('next_step', 'Chưa nêu rõ bước xử lý tiếp theo hoặc thời điểm theo dõi.', 'Tiếp theo bạn sẽ làm gì và khi nào: gửi báo giá/danh mục, gọi lại, hẹn gặp hay xin hỗ trợ BGĐ?'));
  }

  return {
    pass: issues.length === 0,
    source: 'local',
    issues,
    checklist,
    detected: {
      product: checklist.find(x => x.code === 'product')?.ok ? 'Có dấu hiệu cụ thể' : '',
      policy: checklist.find(x => x.code === 'policy')?.ok ? 'Có chi tiết' : '',
      feedback: checklist.find(x => x.code === 'feedback')?.ok ? feedbackText : '',
      nextStep: checklist.find(x => x.code === 'next_step')?.ok ? 'Có bước theo dõi' : ''
    },
    note: ''
  };
}

function normalizeAiReportIssues(items, cfg) {
  const allowed = new Set(['report_length','product','policy','feedback','next_step','vague','custom']);
  const out = [];
  for (const x of (Array.isArray(items) ? items : [])) {
    const code = allowed.has(String(x?.code || '').trim()) ? String(x.code).trim() : 'vague';
    if (code === 'product' && !cfg.requireProduct) continue;
    if (code === 'policy' && !cfg.requirePolicy) continue;
    if (code === 'feedback' && !cfg.requireFeedback) continue;
    if (code === 'next_step' && !cfg.requireNextStep) continue;
    const message = String(x?.message || '').trim();
    if (!message) continue;
    out.push({
      code,
      message: message.slice(0, 500),
      question: String(x?.question || '').trim().slice(0, 500),
      severity: 'required'
    });
  }
  return out;
}

function mergeReportAudits(localAudit, aiAudit) {
  const hard = (localAudit?.issues || []).filter(x => x.code === 'report_length');
  const semantic = (aiAudit?.issues || []);
  const seen = new Set();
  const issues = [...hard, ...semantic].filter(x => {
    const k = `${x.code}|${x.message}`;
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });
  return {
    pass: issues.length === 0,
    source: aiAudit ? 'ai+local' : 'local',
    issues,
    checklist: localAudit?.checklist || [],
    detected: aiAudit?.detected || localAudit?.detected || {},
    note: aiAudit?.note || localAudit?.note || ''
  };
}

function formatReportAuditMessage(audit) {
  const issues = Array.isArray(audit?.issues) ? audit.issues : [];
  if (!issues.length) return 'Báo cáo đã đạt các tiêu chí khai báo trước khi lưu.';
  const body = issues.map((x, i) => `${i + 1}. ${x.message}${x.question ? `\n   → ${x.question}` : ''}`).join('\n\n');
  return `AI phát hiện báo cáo chưa đủ cụ thể:\n\n${body}\n\nHãy bổ sung đúng dữ kiện thực tế của lần giao dịch này; không suy đoán thay khách hàng.`;
}

  useEffect(() => {
    if (!isUnlocked || !customers.length || !staffList.length) return;
    const overdue = customers.filter(isCustomerOverdue);
    const byStaff = overdue.reduce((acc, c) => { acc[c.salesRep] = (acc[c.salesRep] || 0) + 1; return acc; }, {});
    Object.entries(byStaff).forEach(([name, count]) => {
      const s = staffList.find(x => x.name === name);
      if (!s) return;
      if (count > 4 && !s.isLocked) {
        const recentlyUnlocked = s.unlockedAt && (Date.now() - s.unlockedAt < 86400000);
        if (!recentlyUnlocked) dbUpdate(`staff/${s.id}`, { isLocked: true });
      } else if (count <= 4 && s.unlockedAt) {
        dbUpdate(`staff/${s.id}`, { unlockedAt: null });
      }
    });
    staffList.forEach(s => { if (!byStaff[s.name] && s.unlockedAt) dbUpdate(`staff/${s.id}`, { unlockedAt: null }); });

      const now = new Date();
      let found = false;
      for (const c of customers) {
        if (c.salesRep !== currentStaff.name) continue;
        for (const apt of (c.appointments || [])) {
          if (apt.isCompleted) continue;
          const at = new Date(`${apt.date}T${apt.time}`);
          const diff = (at.getTime() - now.getTime()) / 60000;
          if (diff > 0 && diff <= 1440) {
            if (!dismissedOverdueRef.current.has(apt.id + '_upcoming')) {
              setActiveAlert({ id: apt.id, customerId: c.id, staffName: c.salesRep, customerName: c.name, type: c.type, alertType: 'upcoming',
                msg: `Bạn có cuộc hẹn với khách hàng ${c.name} vào lúc ${apt.time} ngày ${viDate(apt.date)}.` });
              found = true; break;
            }
          } else if (diff < 0) {
            if (!dismissedOverdueRef.current.has(apt.id + '_late')) {
              setActiveAlert({ id: apt.id, customerId: c.id, staffName: c.salesRep, customerName: c.name, type: c.type, alertType: 'late',
                msg: `Bạn đã bị trễ hẹn với khách hàng ${c.name} lúc ${apt.time} ngày ${viDate(apt.date)}. Vui lòng xác nhận đã hẹn hoặc thiết lập lịch hẹn mới!` });
              found = true; break;

          }
        }
        if (found) break;

      for (const c of customers) {
        if (c.salesRep !== currentStaff.name) continue;
        if (!isCustomerOverdue(c)) continue;
        const today = getLocalDateString(new Date());
        const items = (c.appointments || []).filter(a => !a.isCompleted && a.date < today);
        items.sort((a, b) => b.date.localeCompare(a.date));
        const target = items[0];

          setOverdueReminder({ customerName: c.name, content: target.content, date: target.date, id: target.id });

      }
    }, 5000);

  }, [isUnlocked, currentStaff, customers, activeAlert, confirmModal, overdueReminder, adviceModal, quickReportCustomer, advisorCustomer]);

        if (Date.now() - saved.timestamp < 12 * 3600 * 1000) return;

        if (made < saved.goal) {

  const handleDailyGateUnlock = async () => {
    if (!dailyGateStaff || dailyGateSavingRef.current) return;
    if (dailyGatePassword !== MASTER_KEY) { notify('Mật khẩu quản trị không chính xác!', 'error'); return; }
    const s = staffList.find(x => x.id === dailyGateStaff.id);
    if (!staffLoadedForGate || !s) { notify('Chưa nhận được nhân viên từ Firebase. Vui lòng kiểm tra kết nối.', 'error'); return; }
    const d = getPreviousDayDeficit(s.name, s);
    if (!d) { setDailyGateMessage(''); setDailyGateStaff(null); setDailyGatePassword(''); handleSelectStaff(s); return; }
    dailyGateSavingRef.current = true;
    setDailyGateSaving(true);
    try {
      // REST ghi thẳng lên server: không phát sự kiện mở khóa cục bộ trước khi được xác nhận.
      const record = { unlockedAt: Date.now(), reason: 'manager_approved_daily_target' };
      let url = dbUrl(`staff/${s.id}/dailyGateUnlocks`);
      const user = window.firebase && typeof firebase.auth === 'function' ? firebase.auth().currentUser : null;
      if (user) url += '?auth=' + encodeURIComponent(await user.getIdToken());
      const response = await fetchTimeout(url, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ [d.date]: record })
      }, 20000);
      if (!response.ok) throw new Error('Firebase HTTP ' + response.status);
      const saved = await response.json();
      if (!saved?.[d.date]?.unlockedAt) throw new Error('Firebase chưa xác nhận quyền mở khóa');
      const confirmed = { ...s, dailyGateUnlocks: { ...s.dailyGateUnlocks, [d.date]: saved[d.date] } };
      setStaffList(prev => prev.map(row => row.id === s.id
        ? { ...row, dailyGateUnlocks: { ...row.dailyGateUnlocks, [d.date]: saved[d.date] } } : row));
      setDailyGateMessage(''); setDailyGateStaff(null); setDailyGatePassword('');
      notify(`Đã lưu mở khóa cho ${s.name} trên Firebase. Các thiết bị khác sẽ tự cập nhật khi có kết nối.`, 'success', 6000);
      handleSelectStaff(confirmed);
    } catch (error) {
      notify('Chưa xác nhận được mở khóa trên Firebase. Kiểm tra kết nối/quyền ghi và thử lại; không mở tạm trên máy này.', 'error', 7000);

    /* Luôn kiểm tra trước khi lưu theo thiết lập BGĐ.
       - Kiểm tra cục bộ chạy tức thời.

    if (reportQualityConfig.enabled) {

        if (reportQualityConfig.aiBeforeSave && reportWordCount(formData.report) >= Math.min(10, reportQualityConfig.minReportWords)) {

            finalAudit = { ...localAudit, aiUnavailable: true, note: 'AI tạm chưa kết nối được; hệ thống đã dùng bộ kiểm tra cục bộ dự phòng.' };

  const handleFileUpload = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setPendingFileName(file.name);
    setExcelRawData(null); setExcelHeaders([]);
    setUploadBusy(true); setUploadMsg('Đang đọc file...');
    const reader = new FileReader();
    reader.onerror = () => {
      setUploadBusy(false); setUploadMsg('');
      notify('Không đọc được file (lỗi trình duyệt)', 'error'); setPendingFileName('');
    };
    reader.onload = (ev) => {
      try {
        /* ArrayBuffer thay cho readAsBinaryString: doc dung file .xlsx lon, khong loi ky tu */
        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array', cellDates: true });
        if (!wb.SheetNames.length) throw new Error('no sheet');
        const ws = wb.Sheets[wb.SheetNames[0]];

        /* Doc dang mang 2 chieu de KHONG bo sot cot khi o dau tien trong */
        const matrix = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', blankrows: false, raw: false });
        if (matrix.length < 2) {
          setUploadBusy(false); setUploadMsg('');
          notify('File Excel không có dữ liệu (cần ít nhất 1 dòng tiêu đề + 1 dòng dữ liệu)', 'error');
          setPendingFileName(''); return;
        }

        /* Tim dong tieu de that su: dong dau tien co >=2 o co chu */
        let hIdx = 0;
        for (let i = 0; i < Math.min(matrix.length, 12); i++) {
          const filled = matrix[i].filter(v => String(v ?? '').trim() !== '').length;
          if (filled >= 2) { hIdx = i; break; }
        }

        const rawHeaders = matrix[hIdx].map((h, i) => {
          const t = String(h ?? '').trim();
          return t || `Cột ${i + 1}`;
        });
        /* Chong trung ten cot -> tranh mat cot khi Excel co 2 cot cung ten */
        const seen = {};
        const headers = rawHeaders.map(h => {
          if (seen[h] === undefined) { seen[h] = 0; return h; }
          seen[h] += 1; return `${h} (${seen[h] + 1})`;
        });

        const data = [];
        for (let i = hIdx + 1; i < matrix.length; i++) {
          const row = matrix[i];
          if (!row || row.every(v => String(v ?? '').trim() === '')) continue;
          const obj = {};
          headers.forEach((h, c) => { obj[h] = row[c] ?? ''; });
          data.push(obj);
        }

        if (!data.length) {
          setUploadBusy(false); setUploadMsg('');
          notify('File Excel không có dòng dữ liệu nào', 'error'); setPendingFileName(''); return;
        }

        setExcelHeaders(headers);
        setExcelRawData(data);

        /* Tu doan cot theo dung khung: Ten KH - Nguoi lien he - Dien thoai - Dia chi.
           Moi cot chi duoc nhan 1 lan (taken) de "Người liên hệ" khong bi cot SDT cuop mat. */
        const low = headers.map(h => h.toLowerCase().trim().replace(/\s+/g, ' '));
        const taken = new Set();
        const pick = (exact, partial) => {
          for (const k of exact) {
            const i = low.findIndex((h, idx) => !taken.has(idx) && h === k);
            if (i > -1) { taken.add(i); return headers[i]; }
          }
          for (const k of partial) {
            const i = low.findIndex((h, idx) => !taken.has(idx) && h.includes(k));
            if (i > -1) { taken.add(i); return headers[i]; }
          }
          return '';
        };

        /* Thu tu doan quan trong: doan cai co tu khoa dac trung nhat truoc */
        const mPhone = pick(
          ['số điện thoại', 'điện thoại', 'sđt', 'sdt', 'phone', 'mobile', 'số đt', 'đt'],
          ['điện thoại', 'sđt', 'sdt', 'phone', 'mobile']);
        const mContact = pick(
          ['người liên hệ', 'nguoi lien he', 'người đại diện', 'đại diện', 'liên hệ',
           'contact', 'người phụ trách', 'chủ nhà thuốc', 'dược sĩ'],
          ['người liên hệ', 'đại diện', 'liên hệ', 'contact', 'phụ trách', 'dược sĩ']);
        const mAddress = pick(
          ['địa chỉ', 'dia chi', 'address'],
          ['địa chỉ', 'dia chi', 'address']);
        const mName = pick(
          ['tên khách hàng', 'tên kh', 'khách hàng', 'tên nhà thuốc', 'nhà thuốc', 'tên', 'name'],
          ['tên', 'name', 'khách hàng', 'nhà thuốc', 'công ty', 'cơ sở']);

        setExcelMapping({ name: mName, contactPerson: mContact, phone: mPhone, address: mAddress });
        setUploadBusy(false);
        setUploadMsg(`Đã đọc ${data.length} dòng · ${headers.length} cột`);
        notify(`Đã đọc file: ${data.length} dòng, ${headers.length} cột`, 'success');
      } catch (err) {
        console.error('Excel read error:', err);
        setUploadBusy(false); setUploadMsg('');
        notify('Không đọc được file Excel. Hãy lưu lại dạng .xlsx rồi thử lại.', 'error');
        setPendingFileName('');
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = '';
  };

  /* Bo ve an toan: du loi gi xay ra, giao dien khong bao gio ket o trang thai "Dang luu" */
  const safeFinish = () => { try { rtResume(); } catch (e) {} setUploadBusy(false); setUploadMsg(''); };

  /* Them file moi vao Firebase (KHONG xoa cac file da co) — chia lo de khong vo gioi han REST */
  const handleConfirmMapping = async () => {
    if (!excelRawData) return;
    if (!excelMapping.name) { notify('Vui lòng chọn cột Tên khách hàng', 'error'); return; }
    if (uploadBusy) return;

    const fileId = uuid();
    const norm = (v) => {
      if (v === null || v === undefined) return '';
      if (v instanceof Date) return v.toLocaleDateString('vi-VN');
      return String(v).trim();
    };

    const rows = excelRawData.map(r => ({
      id: uuid(),
      fileId,
      name: norm(r[excelMapping.name]),
      /* Nguoi lien he: khong bat buoc -> de trong neu file khong co */
      contactPerson: excelMapping.contactPerson ? norm(r[excelMapping.contactPerson]) : '',
      /* SDT: bo dau cach/cham/gach, giu lai so 0 dau neu Excel da cat mat */
      phone: excelMapping.phone ? norm(r[excelMapping.phone]).replace(/[\s.\-()]/g, '') : '',
      address: excelMapping.address ? norm(r[excelMapping.address]) : '',
      isCalled: false,
      claimedBy: ''
    })).filter(c => c.name);

    if (!rows.length) {
      notify(`Không có dòng nào hợp lệ — cột "${excelMapping.name}" đang trống. Hãy chọn lại cột tên khách hàng.`, 'error', 5200);
      return;
    }

    /* AN TOAN: hien danh sach + luu localStorage NGAY, truoc khi dung toi Firebase.
       Du Firebase co hong hoan toan, nhan vien van co danh sach de goi. */
    setExcelCustomers(prev => {
      const ids = new Set(prev.map(p => p.id));
      const merged = [...prev, ...rows.filter(r => !ids.has(r.id))];
      try { localStorage.setItem('ideco_excelBackup', JSON.stringify(merged.slice(0, 8000))); } catch (e) {}
      return merged;
    });

    setUploadBusy(true);
    uploadCancelRef.current = false;
    setUploadMsg(`Kiểm tra kết nối Firebase...`);
    try {

    /* Thu ghi 1 ban ghi nho truoc -> phat hien ngay loi quyen/mang,
       thay vi treo giua chung khi da lưu do dang */
    const probeId = '__probe__';
    const probe = await dbUpdateDetailed('excelCustomers', { [probeId]: { t: Date.now() } }, 2, 12000);
    if (!probe.ok) {
      setUploadBusy(false); setUploadMsg('');
      setDbError({
        stage: 'Kiểm tra ghi thử',
        err: probe.err,
        hint: probe.hint,
        url: `${DB}/excelCustomers.json`
      });
      notify('Không ghi được vào Firebase — xem khung đỏ để biết nguyên nhân', 'error', 6000);
      return;
    }
    setDbError(null);
    await dbRemove(`excelCustomers/${probeId}`);

    setUploadMsg(`Chuẩn bị lưu ${rows.length} dòng...`);
    rtPause();   /* tam dung realtime -> khong tai lai ca danh sach giua chung */

    /* Chia lo theo DUNG LUONG (khong theo so dong): tieng Viet co dau 3 byte/ky tu,
       nen 400 dong co the vuot 1MB va Firebase se im lang tu choi -> treo. */
    const MAX_BYTES = 256 * 1024;   /* 256KB / lo — an toan tuyet doi */
    const MAX_ROWS  = 150;
    const batches = [];
    let cur = {}, curBytes = 0, curCount = 0;
    for (const r of rows) {
      const sz = JSON.stringify(r).length + r.id.length + 4;
      if (curCount > 0 && (curBytes + sz > MAX_BYTES || curCount >= MAX_ROWS)) {
        batches.push(cur); cur = {}; curBytes = 0; curCount = 0;
      }
      cur[r.id] = r; curBytes += sz; curCount++;
    }
    if (curCount > 0) batches.push(cur);

    let saved = 0;
    const failedBatches = [];
    let lastErr = null;
    for (let b = 0; b < batches.length; b++) {
      if (uploadCancelRef.current) break;
      const n = Object.keys(batches[b]).length;
      setUploadMsg(`Đang lưu ${saved}/${rows.length} dòng  ·  lô ${b + 1}/${batches.length}`);
      const res = await dbUpdateDetailed('excelCustomers', batches[b], 3, 25000);
      if (res.ok) saved += n;
      else {
        failedBatches.push(batches[b]);
        lastErr = res;
        /* Loi khong the khac phuc (rules/URL) -> dung ngay, khong nem tiep 30 lo vo ich */
        if (res.fatal) {
          setDbError({ stage: `Lưu lô ${b + 1}/${batches.length}`, err: res.err, hint: res.hint, url: `${DB}/excelCustomers.json` });
          break;
        }
      }
      /* nhuong CPU cho giao dien ve lai -> khong bi "dung hinh" */
      await new Promise(res2 => setTimeout(res2, 60));
    }
    if (lastErr && !lastErr.fatal) {
      setDbError({ stage: 'Lưu dữ liệu', err: lastErr.err, hint: lastErr.hint, url: `${DB}/excelCustomers.json` });
    }

    const cancelled = uploadCancelRef.current;

    if (saved === 0) {
      rtResume();
      setUploadBusy(false); setUploadMsg('');
      notify(cancelled
        ? 'Đã hủy — chưa lưu dòng nào.'
        : 'Không lưu được lên Firebase. Kiểm tra mạng / quyền ghi Database rồi thử lại.', 'error', 5500);
      return;
    }

    const okFile = await dbSet(`excelFiles/${fileId}`, {
      id: fileId,
      name: pendingFileName || ('File ' + new Date().toLocaleDateString('vi-VN')),
      uploadedAt: Date.now(),
      uploadedBy: currentStaff?.name || '',
      count: saved
    });

    /* Hien ngay tren man hinh, khong doi realtime day ve */
    const savedIds = new Set();
    batches.forEach((bt, i) => { if (!failedBatches.includes(bt)) Object.keys(bt).forEach(k => savedIds.add(k)); });
    setExcelCustomers(prev => {
      const ids = new Set(prev.map(p => p.id));
      return [...prev, ...rows.filter(r => savedIds.has(r.id) && !ids.has(r.id))];
    });
    if (okFile) {
      setExcelFiles(prev => ({
        ...prev,
        [fileId]: { id: fileId, name: pendingFileName || ('File ' + new Date().toLocaleDateString('vi-VN')),
                    uploadedAt: Date.now(), uploadedBy: currentStaff?.name || '', count: saved }
      }));
    }

    rtResume();
    setUploadBusy(false); setUploadMsg('');
    const missing = rows.length - saved;

    if (missing > 0) {
      /* Giu lai phan chua luu de bam "Lưu tiếp phần còn thiếu", khong phai lam lai tu dau */
      const savedNameSet = new Set(rows.filter(r => savedIds.has(r.id)).map(r => r.name));
      setResumeState({
        fileId,
        fileName: pendingFileName || 'File',
        rows: rows.filter(r => !savedIds.has(r.id)),
        total: rows.length,
        saved
      });
      notify(cancelled
        ? `Đã dừng — lưu được ${saved}/${rows.length} dòng. Bấm "Lưu tiếp" để hoàn tất.`
        : `Lưu được ${saved}/${rows.length} dòng — còn ${missing} dòng lỗi mạng. Bấm "Lưu tiếp" để hoàn tất.`, 'warning', 6000);
    } else {
      setResumeState(null);
      notify(`Đã thêm ${saved} khách hàng từ file "${pendingFileName}"`, 'success');
    }
    setExcelRawData(null); setExcelHeaders([]); setPendingFileName('');
    } catch (err) {
      console.error('upload error:', err);
      safeFinish();
      notify('Có lỗi bất ngờ khi lưu. Phần đã lưu vẫn giữ nguyên — hãy thử lại.', 'error', 5500);
    }
  };

  /* Luu tiep phan con thieu — dung lai dung fileId cu */
  const handleResumeUpload = async () => {
    if (!resumeState || uploadBusy) return;
    const { fileId, rows, total, saved: already } = resumeState;
    setUploadBusy(true);
    uploadCancelRef.current = false;
    rtPause();
    try {
    const MAX_BYTES = 256 * 1024, MAX_ROWS = 150;
    const batches = [];
    let cur = {}, curBytes = 0, curCount = 0;
    for (const r of rows) {
      const sz = JSON.stringify(r).length + r.id.length + 4;
      if (curCount > 0 && (curBytes + sz > MAX_BYTES || curCount >= MAX_ROWS)) {
        batches.push(cur); cur = {}; curBytes = 0; curCount = 0;
      }
      cur[r.id] = r; curBytes += sz; curCount++;
    }
    if (curCount > 0) batches.push(cur);

    let saved = 0;
    const stillFailed = [];
    for (let b = 0; b < batches.length; b++) {
      if (uploadCancelRef.current) break;
      const n = Object.keys(batches[b]).length;
      setUploadMsg(`Đang lưu tiếp ${already + saved}/${total} dòng  ·  lô ${b + 1}/${batches.length}`);
      const ok = await dbUpdateRetry('excelCustomers', batches[b], 4, 25000);
      if (ok) saved += n; else stillFailed.push(batches[b]);
      await new Promise(res => setTimeout(res, 60));
    }

    const okIds = new Set();
    batches.forEach(bt => { if (!stillFailed.includes(bt)) Object.keys(bt).forEach(k => okIds.add(k)); });
    setExcelCustomers(prev => {
      const ids = new Set(prev.map(p => p.id));
      return [...prev, ...rows.filter(r => okIds.has(r.id) && !ids.has(r.id))];
    });
    const totalSaved = already + saved;
    await dbUpdate(`excelFiles/${fileId}`, { count: totalSaved });
    setExcelFiles(prev => prev[fileId] ? { ...prev, [fileId]: { ...prev[fileId], count: totalSaved } } : prev);

    rtResume();
    setUploadBusy(false); setUploadMsg('');
    const left = rows.filter(r => !okIds.has(r.id));
    if (left.length) {
      setResumeState({ ...resumeState, rows: left, saved: totalSaved });
      notify(`Còn ${left.length} dòng chưa lưu được. Thử lại khi mạng ổn định hơn.`, 'warning', 5500);
    } else {
      setResumeState(null);
      notify(`Hoàn tất — đã lưu đủ ${totalSaved}/${total} khách hàng`, 'success');
    }
    } catch (err) {
      console.error('resume error:', err);
      safeFinish();
      notify('Có lỗi bất ngờ khi lưu tiếp. Hãy thử lại.', 'error', 5000);

  /* Xoa 1 file va toan bo dong thuoc file do */
  const handleDeleteExcelFile = (fileId, fileName) => {
    setConfirmModal({

      requirePassword: true,

      onConfirm: async () => {
        const victims = excelCustomers.filter(c => c.fileId === fileId);

          if (ok) done += Object.keys(upd).length; else fail += Object.keys(upd).length;

        }

  /* ===== KIEM TRA KET NOI FIREBASE — chay tung buoc de biet CHINH XAC hong o dau ===== */
  const runDiagnostic = async () => {
    if (diagRunning) return;
    setDiagRunning(true);
    setDiagResult(null);
    const steps = [];
    const add = (name, ok, detail) => steps.push({ name, ok, detail });

    /* 0. Dang dung duong truyen nao */
    add('Kết nối Firebase', FB_READY,
      FB_READY ? 'Dùng SDK WebSocket (giống bản gốc AI Studio chạy tốt)'
               : 'KHÔNG tải được Firebase SDK — đang chạy REST dự phòng. Kiểm tra mạng có chặn gstatic.com không.');

    /* 1. Giao thuc trang */
    const proto = location.protocol;
    add('Giao thức trang', proto !== 'file:', proto === 'file:'
      ? 'Đang mở bằng file:// — trình duyệt chặn gọi mạng. Hãy tải file lên hosting (Netlify/GitHub Pages) hoặc mở qua http://localhost.'
      : `${proto}// — hợp lệ`);

      readOk = r.ok;
      let b = ''; try { b = (await r.text()).slice(0, 200); } catch (e) {}
      add('Đọc dữ liệu (GET)', r.ok, r.ok ? 'Đọc được' : `HTTP ${r.status} — ${b}`);
    } catch (e) {
      add('Đọc dữ liệu (GET)', false, e.name === 'AbortError'

    }

    const tId = '__diag__' + Date.now();
    const w = await dbUpdateDetailed('__diag__', { [tId]: { t: Date.now() } }, 1, 12000);
    add('Ghi dữ liệu (thử 1 dòng)', w.ok,
      w.ok ? `Ghi được qua ${w.via} — quyền ghi OK` : `${w.err}${w.hint ? '  →  ' + w.hint : ''}`);

    /* 5. Ghi thu 1 lo lon giong that */
    let bulkOk = false;
    if (w.ok) {
      const fake = {};
      for (let i = 0; i < 150; i++) {
        fake['__diag_row_' + i] = { id: '__diag_row_' + i, fileId: tId,
          name: 'Nhà thuốc kiểm tra kết nối số ' + i, phone: '0909000' + i,

          isCalled: false, claimedBy: '' };

      bulkOk = bw.ok;
      const kb = (new Blob([JSON.stringify(fake)]).size / 1024).toFixed(0);
      add('Ghi lô 150 dòng thật', bw.ok,
        bw.ok ? `Ghi ${kb}KB qua ${bw.via} trong ${((Date.now() - t0) / 1000).toFixed(1)}s — tốc độ ổn`

  /* ============== micro devices ============== */
  const stopMicMonitor = useCallback(() => {
    if (micRafRef.current) { cancelAnimationFrame(micRafRef.current); micRafRef.current = null; }
    try { micStreamRef.current?.getTracks().forEach(t => t.stop()); } catch (e) {}
    micStreamRef.current = null;
    try { micAudioCtxRef.current?.close(); } catch (e) {}
    micAudioCtxRef.current = null;
    setMicLevel(0);
  }, []);

  /* Mo stream de do muc am thanh -> giup chon dung micro */
  const startMicMonitor = useCallback(async (deviceId) => {
    stopMicMonitor();
    try {
      const constraints = {
        audio: deviceId
          ? { deviceId: { exact: deviceId }, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
          : { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      };
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      micStreamRef.current = stream;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const ctx = new Ctx();
      micAudioCtxRef.current = ctx;
      const src = ctx.createMediaStreamSource(stream);
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 512;
      src.connect(analyser);
      const buf = new Uint8Array(analyser.frequencyBinCount);
      const loop = () => {
        analyser.getByteTimeDomainData(buf);
        let peak = 0;
        for (let i = 0; i < buf.length; i++) { const v = Math.abs(buf[i] - 128) / 128; if (v > peak) peak = v; }
        setMicLevel(Math.min(100, Math.round(peak * 260)));
        micRafRef.current = requestAnimationFrame(loop);
      };
      loop();
      return true;
    } catch (e) {
      return false;
    }
  }, [stopMicMonitor]);

  }, [notify, selectedMicId]);

  const chooseMic = useCallback(async (d) => {
    const id = d ? d.deviceId : '';
    const label = d ? (d.label || 'Micro không tên') : '';
    setSelectedMicId(id); setSelectedMicLabel(label);
    try {
      if (id) { localStorage.setItem('ideco_micId', id); localStorage.setItem('ideco_micLabel', label); }
      else { localStorage.removeItem('ideco_micId'); localStorage.removeItem('ideco_micLabel'); }
    } catch (e) {}
    const ok = await startMicMonitor(id);
    if (!ok) notify('Không mở được micro này, thử thiết bị khác', 'error');
    else notify(`Đã chọn: ${label || 'Micro mặc định hệ thống'} — hãy nói thử để xem vạch sóng`, 'success');
  }, [startMicMonitor, notify]);

  /* Tu dong cap nhat khi cam/rut micro USB, tai nghe bluetooth... */
  useEffect(() => {
    if (!navigator.mediaDevices?.addEventListener) return;
    const h = () => { refreshMicDevices(false); };
    navigator.mediaDevices.addEventListener('devicechange', h);
    return () => navigator.mediaDevices.removeEventListener('devicechange', h);
  }, [refreshMicDevices]);

  useEffect(() => { if (showMicPicker) refreshMicDevices(true); else stopMicMonitor(); }, [showMicPicker]);
  useEffect(() => () => stopMicMonitor(), [stopMicMonitor]);

  /* Bộ chọn thiết bị dùng cho kiểm tra âm lượng; nhận giọng nói dùng micro do trình duyệt/hệ điều hành chọn. */
  const ensureSelectedMicStream = useCallback(async () => {
    if (!selectedMicId) return;
    if (micStreamRef.current) return;
    try {
      const s = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: { exact: selectedMicId } } });
      micStreamRef.current = s;
    } catch (e) {}
  }, [selectedMicId]);

  /* ============== KHAI BAO NHANH: speech -> text -> AI fill form ============== */
  const stopVoiceDeclaration = useCallback(() => {
    voiceDeclListeningRef.current = false;
    setIsVoiceDeclListening(false);
    const r = voiceDeclRecognitionRef.current;
    voiceDeclRecognitionRef.current = null;
    if (r) { r.onend = null; r.onresult = null; try { r.stop(); } catch (e) {} }
  }, []);

  const startVoiceDeclaration = useCallback(() => {
    if (voiceDeclListeningRef.current) { stopVoiceDeclaration(); return; }
    window.idecoSpeech.stop();
    stopMicMonitor();
    if (micStreamRef.current) { micStreamRef.current.getTracks().forEach(track => track.stop()); micStreamRef.current = null; }
    voiceDeclListeningRef.current = true; setIsVoiceDeclListening(true);
    voiceDeclRecognitionRef.current = window.idecoSpeech.start({
      base: voiceDeclaration || '',
      onText: text => { voiceDeclBaseRef.current = text; setVoiceDeclaration(text); },
      onStop: () => { voiceDeclRecognitionRef.current = null; voiceDeclListeningRef.current = false; setIsVoiceDeclListening(false); },
      onError: message => notify(message, 'warning', 6000)
    });
  }, [voiceDeclaration, notify, stopVoiceDeclaration, stopMicMonitor]);

  const handleAnalyzeVoiceDeclaration = async () => {
    const text = (voiceDeclaration || '').trim();
    if (!text) { notify('Hãy nói hoặc nhập nội dung khai báo trước khi phân tích AI.', 'warning'); return; }
    stopVoiceDeclaration();
    setIsVoiceDeclAnalyzing(true); setVoiceDeclNotice(null);
    try {
      const r = await analyzeVoiceCustomerDeclaration(text);
      const allowedTypes = Object.values(CustomerType);
      setFormData(prev => ({
        ...prev,
        name: r.name || prev.name,
        contactPerson: r.contactPerson || prev.contactPerson,
        phone: r.phone ? normPhone(r.phone) : prev.phone,
        address: r.address || prev.address,
        province: (r.province && VIETNAM_PROVINCES.includes(r.province)) ? r.province : prev.province,
        type: (r.type && allowedTypes.includes(r.type)) ? r.type : prev.type,
        report: r.report || prev.report,
        customerFeedback: r.customerFeedback || prev.customerFeedback || ''
      }));
      const missing = r.missing || [];
      const qualityIssues = r.qualityIssues || [];
      setVoiceQualityIssues(qualityIssues);
      setVoiceQualityAdvice(r.qualityAdvice || '');
      if (missing.length) {
        setVoiceDeclNotice({ type: 'warning', text: `AI đã điền các thông tin nhận diện được. Còn thiếu thông tin khai báo: ${missing.join(', ')}.` });
        notify(`Còn thiếu: ${missing.join(', ')}`, 'warning', 6500);
      } else if (qualityIssues.length) {
        setVoiceDeclNotice({ type: 'warning', text: 'AI đã tự điền dữ liệu. Báo cáo vẫn còn vài điểm nên bổ sung để Ban Giám đốc dễ xử lý hơn.' });
        notify('AI đã điền dữ liệu và phát hiện nội dung báo cáo nên bổ sung', 'warning', 5200);
      } else {
        setVoiceDeclNotice({ type: 'success', text: 'AI đã nhận diện đủ thông tin và báo cáo có các nội dung chính cần thiết.' });
        notify('Đã phân tích và tự động điền thông tin khách hàng', 'success', 3600);
      }
    } catch (e) {
      if (e && e.message === 'NO_KEY') {
        setVoiceDeclNotice({ type: 'error', text: 'Chưa có Gemini API key. Vào Hệ thống → Cài đặt AI để nhập/lưu key.' });
        notify('Chưa có Gemini API key', 'error', 5000);
      } else {
        setVoiceDeclNotice({ type: 'error', text: 'Gemini chưa phân tích được nội dung. Kiểm tra mạng/API key rồi thử lại.' });
        notify('Lỗi kết nối Gemini khi phân tích khai báo', 'error');
      }
    } finally { setIsVoiceDeclAnalyzing(false); }
  };

  /* ============== speech to text ============== */
  const applyTranscript = (field, txt) => {
    if (field === 'appointmentContent') setNewAppointment(prev => ({ ...prev, content: txt }));
    else setFormData(prev => ({ ...prev, [field]: txt }));
  };

  const formatSpeechField = (field, text) => {
    if (field === 'phone') return text.replace(/\s+/g, '');
    if (['name', 'contactPerson', 'province'].includes(field)) return text.toLowerCase().replace(/(?:^|\s)\S/g, a => a.toUpperCase());
    return text;
  };
  const releaseSpeechStreams = () => {
    stopMicMonitor();
    if (micStreamRef.current) { micStreamRef.current.getTracks().forEach(track => track.stop()); micStreamRef.current = null; }
  };
  const startGlobalRecognition = () => {
    const field = activeFieldRef.current;
    window.idecoSpeech.stop();
    if (!field) { notify('Chạm vào ô cần nhập trước khi bật micro.', 'warning'); return; }
    releaseSpeechStreams();
    isGlobalListeningRef.current = true; setIsGlobalListening(true);
    globalRecognitionRef.current = window.idecoSpeech.start({
      base: textBeforeRecordingRef.current,
      format: text => formatSpeechField(field, text),
      onText: text => { textBeforeRecordingRef.current = text; applyTranscript(field, text); },
      onStop: () => { globalRecognitionRef.current = null; isGlobalListeningRef.current = false; setIsGlobalListening(false); },
      onError: message => notify(message, 'warning', 6000)
    });
  };
  const toggleGlobalListening = () => {
    if (isGlobalListeningRef.current) { window.idecoSpeech.stop(); return; }
    const f = activeFieldRef.current;
    textBeforeRecordingRef.current = f ? (f === 'appointmentContent' ? newAppointment.content || '' : formData[f] || '') : '';
    startGlobalRecognition();
  };
  const startRecognition = field => {
    window.idecoSpeech.stop(); releaseSpeechStreams();
    listeningFieldRef.current = field; setListeningField(field);
    recognitionRef.current = window.idecoSpeech.start({
      base: textBeforeRecordingRef.current,
      format: text => formatSpeechField(field, text),
      onText: text => { textBeforeRecordingRef.current = text; applyTranscript(field, text); },
      onStop: () => { recognitionRef.current = null; listeningFieldRef.current = null; setListeningField(null); },
      onError: message => notify(message, 'warning', 6000)
    });
  };
  const toggleListening = field => {
    if (listeningFieldRef.current === field) { window.idecoSpeech.stop(); return; }
    textBeforeRecordingRef.current = field === 'appointmentContent' ? newAppointment.content || '' : formData[field] || '';
    startRecognition(field);
  };
  const handleFocus = field => {
    const previous = activeFieldRef.current;
    activeFieldRef.current = field;
    if (isGlobalListeningRef.current && previous !== field) {
      textBeforeRecordingRef.current = field === 'appointmentContent' ? newAppointment.content || '' : formData[field] || '';
      startGlobalRecognition();
    } else if (listeningFieldRef.current && listeningFieldRef.current !== field) window.idecoSpeech.stop();
  };
  useEffect(() => () => window.idecoSpeech.stop(), [view, selectedCustomerId]);


  /* Hồ sơ của mỗi nhân viên phải có đúng chủ sở hữu; không chọn nhân viên = không xem hồ sơ. */
  const sameStaffOwner = (owner, staff) => Boolean(staff && String(owner || '').trim() &&
    String(owner).trim().normalize('NFC').toLocaleLowerCase('vi') ===
    String(staff.name || '').trim().normalize('NFC').toLocaleLowerCase('vi'));

  /* ============== derived ============== */
  const myCustomers = useMemo(() => customers
    .filter(c => sameStaffOwner(c.salesRep, currentStaff))
    .filter(c => statusFilter ? c.status === statusFilter : true)
    .filter(c => {
      const q = searchTerm.toLowerCase().trim();
      if (!q) return true;
      return (c.name || '').toLowerCase().includes(q)
        || (c.phone || '').includes(q)
        || (c.contactPerson || '').toLowerCase().includes(q)
        || (c.province || '').toLowerCase().includes(q);
    })
    .sort((a, b) => {
      const oa = isCustomerOverdue(a) ? 0 : 1, ob = isCustomerOverdue(b) ? 0 : 1;
      if (oa !== ob) return oa - ob;
      return (b.updatedAt || 0) - (a.updatedAt || 0);
    }), [customers, currentStaff, searchTerm, statusFilter]);

  const todayStats = useMemo(() => {
    const today = getLocalDateString(new Date());
    const mine = customers.filter(c => sameStaffOwner(c.salesRep, currentStaff));
    return {
      total: mine.length,
      today: mine.filter(c => c.transactionDate === today).length,
      won: mine.filter(c => c.status === TransactionStatus.THANH_CONG || c.status === TransactionStatus.THANH_CONG_SP_MOI).length,
      overdue: mine.filter(isCustomerOverdue).length
    };
  }, [customers, currentStaff]);


  /* ============================== LOGIN ============================== */
  if (!isUnlocked) {
    return (
      <div className="h-full flex items-center justify-center p-5 relative overflow-hidden"
           style={{ background: 'linear-gradient(150deg,#0b2545 0%,#13315c 45%,#1d6fd0 100%)' }}>
        <div className="absolute -top-24 -right-20 w-80 h-80 rounded-full blur-3xl" style={{ background: 'rgba(61,155,233,.28)' }} />
        <div className="absolute -bottom-24 -left-16 w-72 h-72 rounded-full blur-3xl" style={{ background: 'rgba(15,157,118,.22)' }} />

        <div className={`relative z-10 w-full max-w-[400px] bg-white rounded-[28px] p-8 sm:p-10 shadow-pop ${loginShake ? 'shake' : 'pop-in'}`}>
          <div className="flex items-center gap-3 mb-8">
            <div className="w-12 h-12 rounded-2xl bg-ink text-white flex items-center justify-center shrink-0">
              <I.UserCheck width="22" height="22" />
            </div>
            <div className="leading-tight">
              <p className="font-display text-[19px] font-extrabold tracking-tight text-ink">IDECO</p>
              <p className="text-[10px] font-bold tracking-[.18em] uppercase text-slate-400">Báo cáo giao dịch</p>
            </div>
          </div>

          <h1 className="font-display text-[19px] sm:text-[21px] leading-[1.28] font-extrabold text-ink mb-2">
            Hãy cùng nhau khai báo <span className="text-brand">real time</span> tại thời điểm giao để cập nhật đúng tình hình xử lý khách — giúp cùng nhau chốt thành công.
          </h1>
          <p className="text-[13px] text-slate-500 mb-7">Nhập mật khẩu truy cập để bắt đầu phiên làm việc.</p>

          <input
            type="password" autoFocus value={loginInput}
            onChange={e => setLoginInput(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && handleLogin()}
            placeholder="••••••••"
            className="fld text-center font-mono text-lg tracking-[.35em] py-4 mb-3"
          />

          <label className="flex items-center gap-2.5 mb-4 cursor-pointer select-none">
            <input type="checkbox" checked={rememberLogin}
                   onChange={e => {
                     const v = e.target.checked;
                     setRememberLogin(v);
                     try {
                       if (!v) { localStorage.removeItem('ideco_savedPass'); localStorage.removeItem('ideco_remember'); }
                       else localStorage.setItem('ideco_remember', '1');
                     } catch (err) {}
                   }}
                   className="w-4 h-4 accent-[#1d6fd0] shrink-0" />
            <span className="text-[12.5px] font-semibold text-slate-500">Ghi nhớ mật khẩu trên máy này</span>
          </label>

          <button onClick={handleLogin}
            className="btn w-full py-4 bg-ink text-white text-[13px] tracking-[.14em] uppercase shadow-lift hover:bg-ink2">
            Truy cập hệ thống
          </button>

          <p className="text-[11px] text-slate-400 mt-6 text-center leading-relaxed">
            Quên mật khẩu? Liên hệ quản trị viên — đổi mật khẩu trong <span className="font-bold text-slate-500">Hệ thống → Bảo mật</span>.
          </p>
          <p className="text-[10.5px] text-slate-400 mt-3 text-center font-semibold tracking-wide">
            Ứng dụng được phát triển bởi: <span className="font-extrabold text-ink">MTRIET</span>
          </p>
        </div>
      </div>
    );
  }

  const locked = !!currentStaff?.isLocked;
  /* Ban ghi dang mo trong "Bao cao nhanh" luon lay ban moi nhat tu Firebase */
  const liveQuickReport = quickReportCustomer
    ? (customers.find(c => c.id === quickReportCustomer.id) || quickReportCustomer)
    : null;
  /* Nút Huyền gợi ý ngoài danh sách cũng luôn dùng bản khách hàng mới nhất từ Firebase */
  const liveAdvisorCustomer = advisorCustomer
    ? (customers.find(c => c.id === advisorCustomer.id) || advisorCustomer)
    : null;
  /* So gop y chua xem cua nhan vien dang dang nhap */
  const unseenFeedbackCount = currentStaff
    ? customers.filter(c => c.salesRep === currentStaff.name && c.feedback && c.feedback.text && !c.feedback.seenAt).length
    : 0;

  /* ============================== MAIN ============================== */
  return (
    <div className="h-full flex flex-col bg-paper overflow-hidden">

      <Popups
        celebrationQueue={celebrationQueue} setCelebrationQueue={setCelebrationQueue}
        performanceAlert={performanceAlert} setPerformanceAlert={setPerformanceAlert}
        showTargetPopup={showTargetPopup} targetGoal={targetGoal} setTargetGoal={setTargetGoal}
        handleConfirmTarget={handleConfirmTarget}
        targetWarning={targetWarning} setTargetWarning={setTargetWarning}
        quickReportCustomer={liveQuickReport} setQuickReportCustomer={setQuickReportCustomer}
        advisorCustomer={liveAdvisorCustomer} setAdvisorCustomer={setAdvisorCustomer}
        advisorMode={advisorMode}
        turboControl={turboControl}
        huyenTurbo={huyenTurbo}
        currentStaff={currentStaff}
        huyenPrimaryAi={huyenPrimaryAi}
        mgrUnlocked={mgrUnlocked} setMgrUnlocked={setMgrUnlocked}
        onSaveFeedback={handleSaveFeedback} onDeleteFeedback={handleDeleteFeedback}
        notify={notify}
      />

      {/* GOP Y MOI TU BAN GIAM DOC */}
      <Modal open={!!(feedbackInbox && feedbackInbox.length)} z={1086} max="max-w-md" onClose={() => setFeedbackInbox(null)}>
        {feedbackInbox && feedbackInbox.length > 0 && (
          <div className="p-7">
            <Ring color="bg-rose-50 text-crimson pulse-ring" icon={<I.Message width="26" height="26" />} />
            <h3 className="font-display text-[19px] font-extrabold text-ink mb-1 text-center">Góp ý từ Ban Giám đốc</h3>
            <p className="text-[13px] text-slate-500 text-center mb-5">
              Bạn có <span className="font-extrabold text-crimson">{feedbackInbox.length}</span> góp ý cần xem và triển khai.
            </p>
            <div className="space-y-2 max-h-[46vh] overflow-y-auto pr-1">
              {feedbackInbox.map(c => (
                <button key={c.id} onClick={() => handleOpenFeedback(c)}
                  className="spine w-full text-left bg-paper rounded-2xl p-4 pl-5 hover:bg-white hover:shadow-soft transition"
                  style={{ '--spine': '#d8324b' }}>
                  <p className="font-bold text-ink text-[14px] truncate">{c.name}</p>
                  <p className="text-[12px] text-slate-500 mt-1 line-clamp-2">{c.feedback?.text}</p>
                  <p className="text-[10.5px] font-bold uppercase tracking-wide text-crimson mt-2">Bấm để xem chi tiết</p>
                </button>
              ))}
            </div>
            <button onClick={() => setFeedbackInbox(null)}
              className="btn w-full py-4 mt-5 bg-ink text-white text-[13px] uppercase tracking-wider">Để sau</button>
          </div>
        )}
      </Modal>

      {/* appointment alert */}
      <Modal open={!!activeAlert} z={1000} max="max-w-sm" shake={activeAlert?.alertType === 'late'}>
        {activeAlert && (
          <div className="p-8 text-center">
            <Ring color={activeAlert.alertType === 'upcoming' ? 'bg-blue-50 text-brand' : 'bg-rose-50 text-crimson pulse-ring'}
                  icon={activeAlert.alertType === 'upcoming' ? <I.Clock width="26" height="26" /> : <I.Alert width="26" height="26" />} />
            <h3 className="font-display text-[20px] font-extrabold text-ink mb-1">Cảnh báo lịch hẹn</h3>
            <p className="font-bold text-ink mb-4">Chào bạn {activeAlert.staffName}!</p>
            <div className="bg-paper rounded-2xl p-4 mb-6 text-[13px] text-slate-600 leading-relaxed">{activeAlert.msg}</div>
            <button onClick={handleConfirmAlert}
              className={`btn w-full py-4 text-white text-[13px] uppercase tracking-wider shadow-lift ${activeAlert.alertType === 'upcoming' ? 'bg-brand' : 'bg-crimson'}`}>
              {activeAlert.alertType === 'upcoming' ? 'Đã nhận thông báo' : 'Đã xác nhận'}
            </button>
          </div>
        )}
      </Modal>

      {/* overdue reminder */}
      <Modal open={!!overdueReminder} z={1010} max="max-w-sm">
        {overdueReminder && (
          <div className="p-8 text-center">
            <Ring color="bg-rose-50 text-crimson pulse-ring" icon={<I.Calendar width="26" height="26" />} />
            <h3 className="font-display text-[19px] font-extrabold text-ink mb-4">Nhắc nhở quá hạn</h3>
            <p className="lbl mb-1">Khách hàng</p>
            <p className="font-display text-[20px] font-extrabold text-ink mb-5">{overdueReminder.customerName}</p>
            <div className="spine bg-rose-50/70 rounded-2xl p-4 pl-5 text-left mb-5" style={{ '--spine': '#d8324b' }}>
              <p className="text-[10px] font-extrabold uppercase tracking-wider text-crimson mb-1">Nội dung hẹn cũ ({viDate(overdueReminder.date)})</p>
              <p className="text-[13px] font-semibold text-ink">{overdueReminder.content}</p>
            </div>
            <p className="text-[12px] text-slate-500 italic mb-6 leading-relaxed">"Nên cập nhật cuộc hẹn đúng và nội dung báo cáo giao dịch mới nhất"</p>
            <button onClick={() => { dismissedOverdueRef.current.add(overdueReminder.id); setOverdueReminder(null); }}
              className="btn w-full py-4 bg-crimson text-white text-[13px] uppercase tracking-wider shadow-lift">Đã hiểu</button>
          </div>
        )}
      </Modal>

      {/* AI advice */}
      <Modal open={!!adviceModal} z={1020} max="max-w-md" onClose={() => setAdviceModal(null)}>
        <div className="p-7">
          <div className="flex items-center gap-3 mb-5">
            <div className="w-11 h-11 rounded-2xl bg-violet-50 text-violet2 flex items-center justify-center"><I.Sparkles width="20" height="20" /></div>
            <div>
              <h3 className="font-display text-[18px] font-extrabold text-ink leading-tight">Lời khuyên từ IDECO</h3>
              <p className="text-[11px] text-slate-400 font-semibold">Trợ lý BGĐ</p>
            </div>
          </div>
          <div className="spine bg-violet-50/50 rounded-2xl p-5 pl-6 max-h-[52vh] overflow-y-auto" style={{ '--spine': '#6d4de0' }}>
            <p className="text-[13.5px] text-ink leading-relaxed whitespace-pre-line">{adviceModal}</p>
          </div>
          <button onClick={() => setAdviceModal(null)} className="btn w-full py-4 mt-6 bg-ink text-white text-[13px] uppercase tracking-wider">Đã hiểu</button>
        </div>
      </Modal>

      {/* overdue following list */}
      <Modal open={!!overdueFollowingAlert} z={1015} max="max-w-lg">
        {overdueFollowingAlert && (
          <div className="p-7">
            <div className="flex items-center gap-3 mb-4">
              <div className="w-11 h-11 rounded-2xl bg-amber-50 text-amber2 flex items-center justify-center"><I.Alert width="20" height="20" /></div>
              <h3 className="font-display text-[18px] font-extrabold text-ink leading-tight">Cảnh báo theo dõi quá hạn</h3>
            </div>
            <p className="text-[13px] text-slate-500 mb-5 leading-relaxed">Các bạn nên xem lại những khách hàng này gấp hay đổi ngay phương án khác để kịp mục tiêu:</p>
            <div className="space-y-2 max-h-[42vh] overflow-y-auto pr-1">
              {overdueFollowingAlert.map((c) => {
                const today = getLocalDateString(new Date());
                const items = (c.appointments || []).filter(a => !a.isCompleted && a.date < today).sort((a, b) => b.date.localeCompare(a.date));
                const d = items[0] ? items[0].date : c.transactionDate;
                return (
                  <button key={c.id} onClick={() => { setOverdueFollowingAlert(null); handleEditCustomer(c); }}
                    className="spine w-full text-left bg-white border border-line rounded-2xl p-4 pl-5 hover:border-amber2 transition" style={{ '--spine': '#e08a1e' }}>
                    <p className="font-bold text-ink text-[14px] mb-1">{c.name}</p>
                    <div className="flex justify-between text-[11px] font-semibold">
                      <span className="text-slate-400">NV <span className="text-amber2">{c.salesRep}</span></span>
                      <span className="text-slate-400">Hẹn trễ <span className="text-crimson font-mono">{viDate(d)}</span></span>
                    </div>
                  </button>
                );
              })}
            </div>
            <button onClick={() => setOverdueFollowingAlert(null)} className="btn w-full py-4 mt-6 bg-amber2 text-white text-[13px] uppercase tracking-wider shadow-lift">Dạ vâng</button>
          </div>
        )}
      </Modal>

      {/* report warning */}
      <Modal open={!!reportWarningMsg} z={1030} max="max-w-md">
        <div className="p-7">
          <div className="flex items-center gap-3 mb-5">
            <div className="w-11 h-11 rounded-2xl bg-amber-50 text-amber2 flex items-center justify-center"><I.Sparkles width="20" height="20" /></div>
            <h3 className="font-display text-[18px] font-extrabold text-ink leading-tight">AI nhắc nhở từ BGĐ</h3>
