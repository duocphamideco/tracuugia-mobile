                  <button onClick={handleAnalyze} disabled={isAnalyzing} className="btn px-3 py-2 bg-violet-50 text-violet2 text-[11px]">
                    {isAnalyzing ? <I.Loader width="13" height="13" className="animate-spin" /> : <I.Sparkles width="13" height="13" />} Lời khuyên IDECO
                  </button>
                </div>
              </div>


              <div className="mb-4">
                <Field label="Khách hàng phản hồi">
                  <textarea aria-label="Khách hàng phản hồi" value={formData.customerFeedback || ''} onFocus={() => handleFocus('customerFeedback')}
                    onChange={e => setFormData({ ...formData, customerFeedback: e.target.value })}
                    placeholder="AI sẽ tự điền nếu phát hiện lời phản hồi của khách: quan tâm sản phẩm nào, đồng ý/từ chối, vướng giá/chính sách, yêu cầu gửi báo giá, hẹn phản hồi..."
                    className="fld min-h-[110px] leading-relaxed resize-y text-[13.5px]" />
                </Field>
                <p className="text-[10.5px] text-slate-400 mt-1.5">Chỉ ghi phản hồi thực tế của khách hàng; không suy đoán thay khách.</p>
              </div>

              <label htmlFor="report-main-text" className="report-input-label">Nội dung giao dịch *</label>
              <textarea id="report-main-text" value={formData.report} onFocus={() => handleFocus('report')}
                onChange={e => setFormData({ ...formData, report: e.target.value })}
                placeholder="Ghi rõ: sản phẩm/danh mục đã chào, chính sách bán hàng đã trao đổi, vướng mắc, việc cần BGĐ hỗ trợ và bước xử lý tiếp theo..."
                className="fld h-44 leading-relaxed resize-y text-[14px]" />
              <p className="text-[11px] text-slate-400 mt-2">
                {formData.report ? formData.report.trim().split(/\s+/).filter(Boolean).length : 0} từ · nên từ 25 từ trở lên, có sản phẩm/danh mục, chính sách đã trao đổi và bước xử lý tiếp theo.
              </p>
              {reportQualityConfig.enabled && (
                <details className="report-quality mt-4 rounded-2xl border border-violet-100 bg-violet-50/45 p-3.5">
                  <summary>Gợi ý hoàn thiện báo cáo · {liveReportAudit.pass ? 'Đủ nội dung cơ bản' : `${liveReportAudit.issues.length} mục cần bổ sung`}</summary>
                  <div className="mt-3">
                  <div className="flex items-center justify-between gap-2 mb-2.5">
                    <p className="text-[11px] font-extrabold text-violet2 uppercase tracking-wider">Kiểm tra nhanh nội dung đang khai</p>
                    <span className={`text-[10px] font-extrabold px-2.5 py-1 rounded-full ${liveReportAudit.pass ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>
                      {liveReportAudit.pass ? 'Đủ dấu hiệu cơ bản' : `Còn ${liveReportAudit.issues.length} mục`}
                    </span>
                  </div>
                  <div className="grid sm:grid-cols-2 gap-2">
                    {liveReportAudit.checklist.map(item => (
                      <div key={item.code} className={`flex items-start gap-2 rounded-xl px-3 py-2.5 border ${item.ok ? 'bg-white border-emerald-100' : 'bg-white border-amber-100'}`}>
                        <div className={`mt-0.5 ${item.ok ? 'text-jade' : 'text-amber2'}`}>
                          {item.ok ? <I.Check2 width="15" height="15" /> : <I.AlertCircle width="15" height="15" />}
                        </div>
                        <div className="min-w-0">
                          <p className={`text-[11px] font-extrabold ${item.ok ? 'text-emerald-800' : 'text-amber-800'}`}>{item.label}</p>
                          <p className="text-[10px] text-slate-400 mt-0.5 leading-relaxed">{item.detail}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                  <p className="text-[10.5px] text-slate-500 mt-2.5 leading-relaxed">
                    Khi bấm <b>Lưu</b>, AI sẽ đọc lại ngữ nghĩa theo thiết lập BGĐ để phát hiện báo cáo viết dài nhưng vẫn chung chung.
                  </p>
                </div>
                </details>
              )}

            </section>

            {/* appointments */}
            {!(formData.status === TransactionStatus.THANH_CONG || formData.status === TransactionStatus.THANH_CONG_SP_MOI || formData.status === TransactionStatus.KHONG_THANH_CONG) && (
              <section id="report-appointments" className="bg-white border border-line rounded-2xl p-5 sm:p-6">
                <div className="flex flex-wrap justify-between items-center gap-2 mb-4">
                  <h3 className="font-display text-[15px] font-extrabold text-ink flex items-center gap-2">
                    <I.Clock width="16" height="16" className="text-amber2" /> Thiết lập lịch hẹn *
                  </h3>
                  <Badge cls="bg-rose-50 text-crimson border-rose-200">Bắt buộc có lịch hẹn mới</Badge>
                </div>

                <div className="bg-paper rounded-2xl p-4 space-y-3">
                  <div className="grid grid-cols-2 gap-3">
                    <Field label="Ngày hẹn">
                      <input type="date" value={newAppointment.date} onChange={e => setNewAppointment({ ...newAppointment, date: e.target.value })} className="fld bg-white" />
                    </Field>
                    <Field label="Giờ hẹn">
                      <input type="time" value={newAppointment.time} onChange={e => setNewAppointment({ ...newAppointment, time: e.target.value })} className="fld bg-white" />
                    </Field>
                  </div>
                  <Field label="Nội dung hẹn">
                    <input value={newAppointment.content} onFocus={() => handleFocus('appointmentContent')}
                      onChange={e => setNewAppointment({ ...newAppointment, content: e.target.value })}
                      placeholder="VD: Gọi điện tư vấn lại..." className="fld bg-white" />
                  </Field>
                  <button onClick={handleAddAppointment} className="btn w-full py-3 bg-ink text-white text-[13px] uppercase tracking-wider">
                    <I.Plus width="15" height="15" /> Lập lịch hẹn
                  </button>
                </div>

                <div className="space-y-2 mt-4">
                  {(formData.appointments || []).map(a => {
                    const past = a.date < getLocalDateString(new Date());
                    return (
                      <div key={a.id} className={`spine rounded-2xl border p-4 pl-5 flex items-center gap-3 ${a.isCompleted ? 'bg-paper border-transparent opacity-50' : 'bg-white border-line'}`}
                           style={{ '--spine': a.isCompleted ? '#cbd5e1' : (past ? '#d8324b' : '#1d6fd0') }}>
                        <div className="flex-1 min-w-0">
                          <p className="font-mono font-bold text-[13px] text-ink">{viDate(a.date)} · {a.time}</p>
                          <p className="text-[12.5px] text-slate-500 mt-0.5">{a.content}</p>
                        </div>
                        <button onClick={() => setFormData({ ...formData, appointments: formData.appointments.filter(x => x.id !== a.id) })}
                          className="btn w-9 h-9 bg-rose-50 text-crimson shrink-0"><I.Trash width="15" height="15" /></button>
                      </div>
                    );
                  })}
                  {(formData.appointments || []).length === 0 && (
                    <p className="text-center text-[12.5px] text-slate-400 py-4">Chưa có lịch hẹn. Thêm một lịch hẹn để lưu được hồ sơ.</p>
                  )}
                </div>
              </section>
            )}
          </div>
        </div>
        </div>
        <div className="report-mobile-save">
          <div className="report-save-context"><strong>{formData.name || 'Khai báo giao dịch'}</strong><span>Kiểm tra thông tin trước khi lưu</span></div>
          <button type="button" onClick={handleSaveCustomer} disabled={isPreSaveChecking} className="btn bg-ink text-white">
            {isPreSaveChecking ? <I.Loader width="18" height="18" className="animate-spin" /> : <I.Save width="18" height="18" />}
            {isPreSaveChecking ? 'Đang kiểm tra…' : 'Lưu báo cáo'}
          </button>
        </div>
      </div>
    </div>
  );
}


/* ============================== POPUPS ============================== */
function Popups({
  celebrationQueue, setCelebrationQueue,
  performanceAlert, setPerformanceAlert,
  showTargetPopup, targetGoal, setTargetGoal, handleConfirmTarget,
  targetWarning, setTargetWarning,
  quickReportCustomer, setQuickReportCustomer,
  advisorCustomer, setAdvisorCustomer, advisorMode,
  turboControl, huyenTurbo, huyenPrimaryAi, currentStaff,
  mgrUnlocked, setMgrUnlocked,
  onSaveFeedback, onDeleteFeedback, notify
}) {
  const firedRef = useRef(null);

  /* ================= GOP Y CUA CAP QUAN LY / BAN GIAM DOC ================= */
  const fb = (quickReportCustomer && quickReportCustomer.feedback && quickReportCustomer.feedback.text)
    ? quickReportCustomer.feedback : null;

  const [fbEditing, setFbEditing] = useState(false);
  const [fbText, setFbText]       = useState('');
  const [fbGate, setFbGate]       = useState(false);
  const [fbPass, setFbPass]       = useState('');
  const [fbShake, setFbShake]     = useState(false);
  const [fbSaving, setFbSaving]   = useState(false);
  const [fbListening, setFbListening] = useState(false);
  const fbRecRef  = useRef(null);
  const fbBaseRef = useRef('');

  /* AI co van tren HO SO DA LUU MOI NHAT */
  const [advisorBusy, setAdvisorBusy] = useState(false);
  const [advisorResult, setAdvisorResult] = useState(null);
  const [advisorError, setAdvisorError] = useState('');

  /* Trạng thái nâng cao được chọn ở DANH SÁCH HỒ SƠ và truyền vào popup.
     Popup không còn nút bật/tắt để tránh bật nhầm sau khi đã chọn kiểu phân tích. */
  const normalAiLabel = 'chế độ thường';

  const runAdvisor = async () => {
    if (!quickReportCustomer) return;
    HUYEN_ANALYSIS_CACHE.clear();
    setAdvisorBusy(true); setAdvisorError(''); setAdvisorResult(null);
    try {
      const r = await analyzeLatestCustomerStrategy(quickReportCustomer, { turbo: huyenTurbo });
      r._huyenMeta={...(r._huyenMeta||{}),analyzedAt:Date.now()};
      huyenRememberAnalysis(quickReportCustomer,'fast',r);
      setAdvisorResult({...r,_savedView:{location:'local',analyzedAt:r._huyenMeta.analyzedAt,sourceUpdatedAt:quickReportCustomer.updatedAt||0}});
      try {
        const saved=await huyenSaveAnalysis(quickReportCustomer,'fast',r);
        setAdvisorResult(saved);
      } catch(saveError) {
        setAdvisorError('Huyền đã phân tích nhưng chưa đồng bộ Firebase: '+saveError.message+' Hãy bấm Lưu kết quả phân tích để thử lại.');
      }
    } catch (e) {
      const msg = String(e && e.message || e);
      setAdvisorError(huyenAdvisorErrorMessage(e));
    } finally { setAdvisorBusy(false); }
  };

  /* Cố vấn mở trực tiếp từ thẻ khách hàng: mở là tự phân tích, không cần bấm lần hai */
  const [directAdvisorBusy, setDirectAdvisorBusy] = useState(false);
  const [directAdvisorResult, setDirectAdvisorResult] = useState(null);
  const [directAdvisorError, setDirectAdvisorError] = useState('');
  const [directAdvisorMinimized, setDirectAdvisorMinimized] = useState(false);


  /* Mở khách hàng mới thì hiện popup đầy đủ; thu nhỏ không làm mất advisorCustomer nên request vẫn tiếp tục. */
  useEffect(() => {
    if (advisorCustomer) setDirectAdvisorMinimized(false);
  }, [advisorCustomer ? advisorCustomer.id : null]);

  const closeOrMinimizeDirectAdvisor = () => {
    if (directAdvisorBusy) {
      setDirectAdvisorMinimized(true);
      notify && notify('Huyền vẫn đang phân tích ở góc màn hình. Bạn có thể tiếp tục làm việc khác.', 'info', 4500);
      return;
    }
    setDirectAdvisorMinimized(false);
    setAdvisorCustomer(null);
  };

  useEffect(() => {
    let cancelled=false;
    setDirectAdvisorResult(null);setDirectAdvisorError('');setDirectAdvisorBusy(false);
    if(advisorCustomer)huyenLoadSavedAnalysis(advisorCustomer,advisorMode).then(r=>{if(!cancelled)setDirectAdvisorResult(r);}).catch(e=>{if(!cancelled)setDirectAdvisorError(e.message);});
    return()=>{cancelled=true;};
  },[advisorCustomer?.id,advisorMode]);
  useEffect(()=>{
    let cancelled=false;
    if(quickReportCustomer)huyenLoadSavedAnalysis(quickReportCustomer,'fast').then(r=>{if(!cancelled)setAdvisorResult(r);}).catch(()=>{});
    return()=>{cancelled=true;};
  },[quickReportCustomer?.id]);

  /* Nếu Huyền đang thu nhỏ, báo khi có kết quả/lỗi mà không kéo người dùng ra khỏi việc đang làm. */
  useEffect(() => {
    if (!advisorCustomer || !directAdvisorMinimized) return;
    if (directAdvisorResult) {
      notify && notify(`Huyền đã phân tích xong ${advisorCustomer.name}. Bấm khung Huyền ở góc màn hình để xem.`, 'success', 6500);
    } else if (directAdvisorError && !directAdvisorBusy) {
      notify && notify('Phiên phân tích bị gián đoạn sau khi đã tự nối lại. Bấm khung Huyền ở góc để thử lại.', 'warning', 6500);
    }
  }, [directAdvisorResult, directAdvisorError, directAdvisorBusy, directAdvisorMinimized]);

  const rerunDirectAdvisor = async () => {
    if (!advisorCustomer) return;
    HUYEN_ANALYSIS_CACHE.clear();
    setDirectAdvisorBusy(true); setDirectAdvisorResult(null); setDirectAdvisorError('');
    try {
      const r = await analyzeLatestCustomerStrategy(advisorCustomer, { turbo: huyenTurbo, mode: advisorMode });
      r._huyenMeta={...(r._huyenMeta||{}),analyzedAt:Date.now()};
      huyenRememberAnalysis(advisorCustomer,advisorMode,r);
      setDirectAdvisorResult({...r,_savedView:{location:'local',analyzedAt:r._huyenMeta.analyzedAt,sourceUpdatedAt:advisorCustomer.updatedAt||0}});
      try {
        const saved=await huyenSaveAnalysis(advisorCustomer,advisorMode,r);
        setDirectAdvisorResult(saved);
      } catch(saveError) {
        setDirectAdvisorError('Đã phân tích xong nhưng chưa lưu lên Firebase: '+saveError.message+' Bấm Lưu kết quả phân tích để thử lại.');
      }
    } catch (e) {
      const msg = String(e && e.message || e);
      setDirectAdvisorError(huyenAdvisorErrorMessage(e));
    } finally { setDirectAdvisorBusy(false); }
  };


  const stopFbMic = () => {
    const r = fbRecRef.current;
    fbRecRef.current = null;
    if (r) { r.onend = null; r.onresult = null; try { r.stop(); } catch (e) {} }
    setFbListening(false);
  };

  const startFbMic = () => {
    window.idecoSpeech.stop(); setFbListening(true);
    fbRecRef.current = window.idecoSpeech.start({
      base: fbText || '', onText: setFbText,
      onStop: () => { fbRecRef.current = null; setFbListening(false); },
      onError: message => notify && notify(message, 'warning', 6000)
    });
  };

  const toggleFbMic = () => { if (fbRecRef.current) stopFbMic(); else startFbMic(); };

  /* Doi ho so -> dong o soan thao, nap lai noi dung */
  useEffect(() => {
    stopFbMic();
    setFbEditing(false); setFbGate(false); setFbPass(''); setFbSaving(false);
    setAdvisorResult(null); setAdvisorError(''); setAdvisorBusy(false);
    setFbText((quickReportCustomer && quickReportCustomer.feedback && quickReportCustomer.feedback.text) || '');
    return () => stopFbMic();
  }, [quickReportCustomer ? quickReportCustomer.id : null]);

  const fbWhen = (t) => {
    try {
      return new Date(t).toLocaleString('vi-VN',
        { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric' });
    } catch (e) { return ''; }
  };

  const openFbEditor = () => {
    /* Nâng cấp: từ danh sách khách hàng -> Báo cáo nhanh -> Góp ý không hỏi lại mật khẩu */
    setFbGate(false); setFbPass('');
    setFbText(fb ? fb.text : ''); setFbEditing(true);
  };

  const tryUnlockFb = () => {
    if (fbPass === MASTER_KEY) {
      setMgrUnlocked(true); setFbGate(false); setFbPass('');
      setFbText(fb ? fb.text : ''); setFbEditing(true);
      notify && notify('Đã mở quyền góp ý cho phiên làm việc này', 'success', 2600);
    } else {
      setFbShake(true); setTimeout(() => setFbShake(false), 520);
      notify && notify('Mã bảo mật không đúng!', 'error');
    }
  };

  const doSaveFb = async () => {
    if (!quickReportCustomer) return;
    stopFbMic(); setFbSaving(true);
    const ok = await onSaveFeedback(quickReportCustomer.id, fbText);
    setFbSaving(false);
    if (ok) { setFbEditing(false); setQuickReportCustomer(null); }
  };

  const doDeleteFb = async () => {
    if (!quickReportCustomer) return;
    stopFbMic();
    if (!fb) { setFbEditing(false); setFbText(''); return; }
    setFbSaving(true);
    const ok = await onDeleteFeedback(quickReportCustomer.id);
    setFbSaving(false);
    if (ok) { setFbEditing(false); setFbText(''); }
  };

  const markSeen = (id) => {
    let seen = [];
    try { seen = JSON.parse(localStorage.getItem('seenCelebrationIds') || '[]'); } catch (e) {}
    if (!seen.includes(id)) {
      seen.push(id);
      if (seen.length > 100) seen.shift();
      localStorage.setItem('seenCelebrationIds', JSON.stringify(seen));
    }
  };

  const dismissCelebration = () => {
    if (!celebrationQueue.length) return;
    markSeen(celebrationQueue[0].id);
    setCelebrationQueue(prev => prev.slice(1));
  };

  useEffect(() => {
    if (!celebrationQueue.length) return;
    const cur = celebrationQueue[0];
    if (firedRef.current !== cur.id) { firedRef.current = cur.id; burstConfetti(); }
    const t = setTimeout(dismissCelebration, 6000);
    return () => clearTimeout(t);
  }, [celebrationQueue]);

  return (
    <React.Fragment>
      {/* celebration */}
      <Modal open={celebrationQueue.length > 0} z={1100} max="max-w-md">
        {celebrationQueue.length > 0 && (
          <div className="p-8 text-center relative overflow-hidden rounded-[26px]">
            <div className="absolute inset-x-0 top-0 h-1.5" style={{ background: 'linear-gradient(90deg,#e08a1e,#f5c451,#e08a1e)' }} />
            <Ring color="bg-amber-50 text-amber2" icon={<I.Trophy width="28" height="28" />} />
            <p className="lbl">Vinh danh chiến binh</p>
            <p className="font-display text-[30px] font-extrabold text-ink leading-tight mt-1 mb-2">{celebrationQueue[0].staffName}</p>
            <p className="text-[13.5px] text-slate-500 mb-5">
              Đã chốt thành công khách hàng <span className="font-bold text-ink">{celebrationQueue[0].customerName}</span>. Ban giám đốc chúc mừng Em!
            </p>
            <div className="spine bg-emerald-50/70 rounded-2xl p-4 pl-5 text-left mb-6" style={{ '--spine': '#0f9d76' }}>
              <p className="text-[12.5px] font-bold text-emerald-800 leading-relaxed uppercase">
                "Chúc mừng bạn đã chốt thành công, mong bạn phát huy và duy trì tốt phát triển khách hàng. Ban giám đốc chúc mừng Em!"
              </p>
            </div>
            <button onClick={dismissCelebration} className="btn w-full py-4 bg-amber2 text-white text-[13px] uppercase tracking-wider shadow-lift">
              Tuyệt vời — xin chúc mừng {celebrationQueue.length > 1 ? `(còn ${celebrationQueue.length - 1})` : ''}
            </button>
          </div>
        )}
      </Modal>

      {/* performance */}
      <Modal open={!!performanceAlert && celebrationQueue.length === 0} z={1060} max="max-w-md">
        {performanceAlert && (
          <div className="p-8 text-center">
            <Ring color="bg-amber-50 text-amber2" icon={<I.BarChart width="26" height="26" />} />
            <h3 className="font-display text-[19px] font-extrabold text-ink mb-4">Nhắc nhở hiệu suất</h3>
            <div className="spine bg-amber-50/60 rounded-2xl p-4 pl-5 text-left mb-5" style={{ '--spine': '#e08a1e' }}>
              <p className="font-bold text-ink text-[13.5px] mb-1.5">Hệ thống ghi nhận bạn khai thác khách hàng hôm qua quá ít!</p>
              <p className="text-[12.5px] text-slate-600 leading-relaxed">Dưới 3 khách hàng là mức báo động. Nếu không tăng số lượng lên, bạn sẽ rất khó đạt chỉ tiêu doanh thu tháng này!</p>
            </div>
            <p className="lbl">Nhân viên cần nỗ lực</p>
            <div className="flex flex-wrap justify-center gap-2 mb-7 max-h-28 overflow-y-auto">
              {performanceAlert.map(n => (
                <span key={n} className="px-3 py-1.5 bg-paper rounded-xl text-[12px] font-bold text-slate-600">{n}</span>
              ))}
            </div>
            <button onClick={() => setPerformanceAlert(null)} className="btn w-full py-4 bg-ink text-white text-[13px] uppercase tracking-wider">Tôi sẽ cố gắng hơn</button>
          </div>
        )}
      </Modal>

      {/* target goal */}
      <Modal open={showTargetPopup} z={1090} max="max-w-md">
        <div className="p-8 text-center">
          <Ring color="bg-blue-50 text-brand" icon={<I.Target width="26" height="26" />} />
          <h3 className="font-display text-[19px] font-extrabold text-ink mb-4">Mục tiêu hôm nay</h3>
          <div className="spine bg-paper rounded-2xl p-4 pl-5 text-left mb-5 max-h-[38vh] overflow-y-auto" style={{ '--spine': '#1d6fd0' }}>
            <p className="text-[13px] text-slate-600 leading-relaxed">
              Huyền chia sẽ nè bạn ơi ! hãy kiên định với mục tiêu mình trong việc MỞ MỚI KHÁCH HÀNG, không chỉ bạn có thưởng mà chúng ta góp vào sự phát triển công ty IDECO mình nhé! Khách hàng mở mới cần thời gian đàm phán, rồi từ chối, yêu sách nên bạn phải mở trong 1 ngày càng nhiều càng tốt thì cuối tháng mới đạt mục tiêu. Nếu bạn ý thức lời khuyên này của Huyền -Trợ lý BGD thì hãy quyết tâm. Luôn mong bạn thành công đó. Mến nha!
            </p>

                      <div className={`rounded-xl border p-3.5 ${String(advisorResult.relationshipDecision).includes('Chú Triết') ? 'bg-rose-50 border-rose-200' : 'bg-amber-50 border-amber-200'}`}>
                        <p className="text-[10.5px] font-extrabold uppercase tracking-wide text-slate-500 mb-1">Đề nghị bước tiếp theo</p>
                        <p className="text-[12.5px] font-extrabold text-ink leading-relaxed">{advisorResult.relationshipDecision}</p>
                        {advisorResult.talkToTriet?.reason && <p className="text-[11.5px] text-slate-600 mt-1.5 leading-relaxed">{advisorResult.talkToTriet.reason}</p>}
                        {advisorResult.talkToTriet?.needed && advisorResult.talkToTriet?.ask && <p className="text-[11.5px] font-bold text-crimson mt-1.5 leading-relaxed">Cần trao đổi Chú Triết: {advisorResult.talkToTriet.ask}</p>}
                      </div>
                    )}
                    {Array.isArray(advisorResult.knowledgeUsed) && advisorResult.knowledgeUsed.length > 0 && (
                      <div className="text-[10.5px] text-slate-400 leading-relaxed"><b>Kho nội bộ đã tham chiếu:</b> {advisorResult.knowledgeUsed.join(' · ')}</div>
                    )}
                    {advisorResult.finalAdvice && (
                      <div className="spine rounded-xl bg-violet-100/60 p-3.5 pl-5" style={{ '--spine':'#6d4de0' }}>
                        <p className="text-[10.5px] font-extrabold uppercase tracking-wide text-violet2 mb-1">Đề xuất tốt nhất</p>
                        <p className="text-[12.5px] font-bold text-ink leading-relaxed">{advisorResult.finalAdvice}</p>
                      </div>
                    )}
                  </div>
                )}
              </div>

              {(quickReportCustomer.appointments || []).length > 0 && (
                <div>
                  <p className="lbl">Lịch hẹn</p>
                  <div className="space-y-2">
                    {quickReportCustomer.appointments.map(a => (
                      <div key={a.id} className={`spine rounded-2xl p-3.5 pl-5 border ${a.isCompleted ? 'bg-paper border-transparent opacity-60' : 'bg-white border-line'}`}
                           style={{ '--spine': a.isCompleted ? '#cbd5e1' : '#e08a1e' }}>
                        <p className="font-mono font-bold text-[12.5px] text-ink">{viDate(a.date)} · {a.time}</p>
                        <p className="text-[12.5px] text-slate-500 mt-0.5">{a.content}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div>
                <p className="lbl">Lời khuyên từ IDECO</p>
                <div className="spine bg-amber-50/40 rounded-2xl p-4 pl-5" style={{ '--spine': '#e08a1e' }}>
                  <p className="text-[12.5px] text-slate-600 italic leading-relaxed">
                    Báo cáo này đã được AI tối ưu để đảm bảo tính chuyên nghiệp và rõ ràng cho Ban Giám đốc.
                  </p>
                </div>
              </div>
            </div>

            <button onClick={() => setQuickReportCustomer(null)} className="btn w-full py-4 mt-5 bg-ink text-white text-[13px] uppercase tracking-wider shrink-0">Đóng cửa sổ</button>
          </div>
        )}
      </Modal>

    </React.Fragment>
  );
}

<script>
(function () {

      '<div style="max-width:560px;margin:12vh auto;padding:28px;font-family:system-ui;background:#fff;'

      + (detail || '') + '</pre></div>';
  }
  try {
    if (!window.Babel) { fatal('Thieu thu vien Babel. Kiem tra ket noi mang roi tai lai trang.', ''); return; }
    var src = document.getElementById('app-source').textContent;
    var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]], filename: 'app.jsx' }).code;
    (0, eval)(out);
  } catch (e) {
    fatal('Loi khi khoi tao ung dung.', (e && (e.message || e)) + '');
    console.error(e);
  }
})();

<script>
(function(){
  var viewport=window.visualViewport;
  function syncViewport(){
    var editor=document.getElementById('mobile-report-editor');
    if(!editor)return;
    var narrow=window.matchMedia('(max-width:639px)').matches;
    if(!narrow){editor.style.removeProperty('--report-vv-height');editor.style.removeProperty('--report-vv-top');editor.classList.remove('keyboard-open');return;}
    var focused=editor.contains(document.activeElement)&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    var normalScale=!viewport||Math.abs(viewport.scale-1)<0.05;
    if(normalScale){editor.style.setProperty('--report-vv-height',(viewport?viewport.height:window.innerHeight)+'px');editor.style.setProperty('--report-vv-top',(viewport?viewport.offsetTop:0)+'px');}
    var keyboard=focused&&normalScale&&viewport&&window.innerHeight-viewport.height>120;
    editor.classList.toggle('keyboard-open',!!keyboard);
  }
  if(viewport){viewport.addEventListener('resize',syncViewport);viewport.addEventListener('scroll',syncViewport);}
  window.addEventListener('resize',syncViewport);
  document.addEventListener('focusin',function(){setTimeout(syncViewport,60)});
  document.addEventListener('focusout',function(){setTimeout(syncViewport,60)});
  window.addEventListener('load',syncViewport);
})();
</script>
